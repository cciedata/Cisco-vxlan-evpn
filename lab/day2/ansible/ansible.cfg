# Day-2 push with Ansible (decided 7 Oct: inventory live from Infrahub, NX-OS config replace, SSH transport).
# Run from this folder:  ansible-playbook day2_push.yml -e site=DC1 [-e devices=DC1-L11] [-e check=true]
[defaults]
inventory = inventory.sh
host_key_checking = False
retry_files_enabled = False
callback_result_format = yaml
forks = 10

[persistent_connection]
command_timeout = 600
connect_timeout = 60
