# OOB switches (aggregation pair and access switches, NX-OS); one query, one template (oob_switch_config.j2)
query OobSwitchConfig($device: String!) {
  DcimDevice(name__value: $device) {
    count
    edges {
      node {
        name { value }
        role { value }
        description { value }
        device_type { node { access_port_count { value } } }
        switch_pair {
          node {
            name { value }
            ... on FabricVpcDomain { domain_id { value } }
            members {
              edges {
                node {
                  name { value }
                  interfaces(role__value: "vpc_keepalive") {
                    edges { node { name { value } ... on InterfaceLayer3 { ip_addresses { edges { node { address { value } } } } } } }
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              role { value }
              ... on InterfaceLayer2 { l2_mode { value } }
              ... on InterfaceLayer3 { ip_addresses { edges { node { address { value } } } } }
              ... on InterfacePhysical {
                port_channel { node { name { value } } }
                access_vlan { node { name { value } vlan_id { value } } }
              }
              ... on InterfacePortChannel {
                members { edges { node { name { value } } } }
                tagged_vlans { edges { node { name { value } vlan_id { value } } } }
              }
            }
          }
        }
      }
    }
  }
  # design values used by oob_switch_config.j2 (one FabricDesign object)
  FabricDesign {
    count
    edges {
      node {
        vpc_keepalive_vrf { value }
        vpc_keepalive_interval_ms { value }
        vpc_keepalive_timeout_s { value }
        vpc_keepalive_hold_timeout_s { value }
        vpc_role_priority { value }
        vpc_role_priority_order { value }
        vpc_delay_restore_s { value }
        vpc_auto_recovery_reload_delay_s { value }
        vpc_stp_priority { value }
        vpc_peer_link_port_channel { value }
        oob_vlans { value }
        dns_lookup { value }
        oob_gateway_host { value }
        mlag_peer_switch { value }
        mlag_peer_gateway { value }
        lacp_mode { value }
        vpc_peer_link_stp_port_type { value }
        attachment_port_stp_edge { value }
        attachment_port_bpdu_guard { value }
        access_port_stp_edge { value }
        access_port_bpdu_guard { value }
    nxos_scp_server { value } local_admin_username { value } oob_switch_local_admin { value }
      }
    }
  }
}
