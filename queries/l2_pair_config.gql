# Phase 2 PC2: L2-only vPC pairs (EDGE and DMZ); one query, two templates (edge_config.j2, dmz_config.j2)
query L2PairConfig($device: String!) {
  DcimDevice(name__value: $device) {
    count
    edges {
      node {
        name { value }
        role { value }
        switch_pair {
          node {
            __typename
            name { value }
            ... on FabricVpcDomain {
              domain_id { value }
              l2_vlans {
                edges {
                  node {
                    name { value }
                    vlan_id { value }
                  }
                }
              }
            }
            members {
              edges {
                node {
                  name { value }
                  interfaces(role__value: "vpc_keepalive") {
                    edges {
                      node {
                        name { value }
                        ... on InterfaceLayer3 {
                          ip_addresses { edges { node { address { value } } } }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              name { value }
              description { value }
              role { value }
              mtu { value }
              ... on InterfaceLayer3 {
                ip_addresses { edges { node { address { value } } } }
              }
              ... on InterfacePhysical {
                port_channel { node { name { value } } }
              }
              ... on InterfacePortChannel {
                members { edges { node { name { value } } } }
              }
            }
          }
        }
      }
    }
  }
}
