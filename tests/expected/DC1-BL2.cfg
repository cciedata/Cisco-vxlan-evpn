hostname DC1-BL2
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature ospf
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature fabric forwarding
feature lacp
feature vpc
feature scp-server
nv overlay evpn

fabric forwarding anycast-gateway-mac 0200.0000.00aa
system nve infra-vlans 3900

ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-PARTNER-SUMMARY seq 10 permit 10.16.160.0/21
ip prefix-list PL-PARTNER-NAT seq 10 permit 10.16.160.0/21 ge 28 le 28
ip prefix-list PL-TRANSIT-SUMMARY seq 10 permit 10.16.144.0/20
ip prefix-list PL-TRANSIT-SUMMARY seq 20 permit 10.16.64.0/18
ip prefix-list PL-TRANSIT-SUMMARY seq 30 permit 10.16.160.0/21
ip prefix-list PL-TRANSIT-SUMMARY seq 40 permit 10.16.0.0/18
ip prefix-list PL-CLOUD seq 10 permit 172.16.0.0/13 le 24
ip prefix-list PL-CLOUD seq 20 permit 172.30.0.0/15 le 24
ip prefix-list PL-TRANSIT-SDWAN-OUT seq 10 permit 10.16.144.0/20
ip prefix-list PL-TRANSIT-SDWAN-OUT seq 20 permit 10.16.64.0/18
ip prefix-list PL-TRANSIT-SDWAN-OUT seq 30 permit 10.16.0.0/18
ip prefix-list PL-BRANCH-SUMMARY seq 10 permit 10.64.0.0/12

route-map RM-PARTNER-TO-FW permit 10
  match ip address prefix-list PL-DEFAULT
route-map RM-PARTNER-FROM-FW permit 10
  match ip address prefix-list PL-PARTNER-NAT

route-map RM-TRANSIT-TO-FW permit 10
  match ip address prefix-list PL-TRANSIT-SUMMARY
route-map RM-TRANSIT-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-TRANSIT-TO-CLOUD permit 10
  match ip address prefix-list PL-DEFAULT
route-map RM-TRANSIT-TO-CLOUD permit 20
  match ip address prefix-list PL-TRANSIT-SUMMARY
route-map RM-TRANSIT-FROM-CLOUD permit 10
  match ip address prefix-list PL-CLOUD

route-map RM-TRANSIT-TO-SDWAN permit 10
  match ip address prefix-list PL-TRANSIT-SDWAN-OUT
route-map RM-TRANSIT-TO-SDWAN permit 20
  match ip address prefix-list PL-CLOUD
route-map RM-TRANSIT-FROM-SDWAN permit 10
  match ip address prefix-list PL-BRANCH-SUMMARY

vrf context management
  ip route 0.0.0.0/0 10.250.0.1

vrf context VPC-KEEPALIVE

vrf context PARTNER
  vni 50031
  ip route 10.16.160.0/21 Null0
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context TRANSIT
  vni 50100
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vlan 2531
  name L3VNI-PARTNER
  vn-segment 50031

vlan 2599
  name L3VNI-TRANSIT
  vn-segment 50100

vlan 3001
  name DC1-TRANSIT-INETFW

vlan 3002
  name DC1-TRANSIT-SDWANFW

vlan 3003
  name DC1-TRANSIT-CLOUD1

vlan 3004
  name DC1-TRANSIT-CLOUD2

vlan 3300
  name DC1-PARTNER-VPNFW

vlan 3900
  name VPC-BACKUP-UNDERLAY

spanning-tree vlan 2531,2599,3001-3004,3300,3900 priority 8192

vpc domain 102
  peer-switch
  role priority 20
  peer-keepalive destination 10.19.17.2 source 10.19.17.3 vrf VPC-KEEPALIVE interval 1000 timeout 5 hold-timeout 3
  delay restore 360
  auto-recovery reload-delay 360
  peer-gateway
  layer3 peer-router
  ip arp synchronize

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.0.25/24

interface loopback0
  description Router ID, BGP peering
  ip address 10.19.0.24/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP source (NVE)
  ip address 10.19.1.22/32
  ip address 10.19.2.2/32 secondary
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan2531
  no shutdown
  mtu 9216
  vrf member PARTNER
  no ip redirects
  ip forward

interface Vlan2599
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip forward

interface Vlan3001
  description DC1-TRANSIT-INETFW
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip address 10.19.16.10/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3002
  description DC1-TRANSIT-SDWANFW
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip address 10.19.16.18/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3003
  description DC1-TRANSIT-CLOUD1
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip address 10.19.16.26/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3004
  description DC1-TRANSIT-CLOUD2
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip address 10.19.16.34/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3300
  description DC1-PARTNER-VPNFW
  no shutdown
  mtu 9216
  vrf member PARTNER
  no ip redirects
  ip address 10.19.9.2/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3900
  description vPC backup underlay
  no shutdown
  mtu 9216
  no ip redirects
  ip address 10.19.3.9/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/34
  description DC1-BL1 Ethernet1/34
  no switchport
  mtu 9216
  vrf member VPC-KEEPALIVE
  ip address 10.19.17.3/31
  no shutdown

interface Ethernet1/1
  description DC1-S1
  no switchport
  mtu 9216
  ip address 10.19.4.83/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/2
  description DC1-S2
  no switchport
  mtu 9216
  ip address 10.19.4.175/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/3
  description DC1-BL1 Ethernet1/3
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2531,2599,3001-3004,3300,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/4
  description DC1-BL1 Ethernet1/4
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2531,2599,3001-3004,3300,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/5
  description DC1-BL1 Ethernet1/5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2531,2599,3001-3004,3300,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/6
  description DC1-BL1 Ethernet1/6
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2531,2599,3001-3004,3300,3900
  channel-group 1000 mode active
  no shutdown

interface port-channel1000
  description DC1-BL1 port-channel1000
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2531,2599,3001-3004,3300,3900
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/7
  description DC1-INETFW1 port20
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3001
  mtu 9216
  channel-group 11 mode active
  no shutdown

interface Ethernet1/8
  description DC1-INETFW2 port20
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3001
  mtu 9216
  channel-group 12 mode active
  no shutdown

interface Ethernet1/9
  description DC1-SDWANFW1 port38
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3002
  mtu 9216
  channel-group 13 mode active
  no shutdown

interface Ethernet1/10
  description DC1-SDWANFW2 port38
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3002
  mtu 9216
  channel-group 14 mode active
  no shutdown

interface Ethernet1/11
  description DC1-VPNFW1 port38
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3300
  mtu 9216
  channel-group 15 mode active
  no shutdown

interface Ethernet1/12
  description DC1-VPNFW2 port38
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3300
  mtu 9216
  channel-group 16 mode active
  no shutdown

interface Ethernet1/13
  description DC1-CLOUD1 FourHundredGigE0/0/0/2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3003
  mtu 9216
  channel-group 31 mode active
  no shutdown

interface Ethernet1/14
  description DC1-CLOUD2 FourHundredGigE0/0/0/2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3004
  mtu 9216
  channel-group 32 mode active
  no shutdown

interface port-channel11
  description DC1-INETFW1 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3001
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 11

interface port-channel12
  description DC1-INETFW2 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3001
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 12

interface port-channel13
  description DC1-SDWANFW1 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3002
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 13

interface port-channel14
  description DC1-SDWANFW2 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3002
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 14

interface port-channel15
  description DC1-VPNFW1 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3300
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 15

interface port-channel16
  description DC1-VPNFW2 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3300
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 16

interface port-channel31
  description DC1-CLOUD1 Bundle-Ether31
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3003
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 31

interface port-channel32
  description DC1-CLOUD2 Bundle-Ether31
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3004
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 32

interface nve1
  no shutdown
  host-reachability protocol bgp
  advertise virtual-rmac
  source-interface loopback1
  global suppress-arp
  global ingress-replication protocol bgp
  member vni 50031 associate-vrf
  member vni 50100 associate-vrf

router ospf UNDERLAY
  router-id 10.19.0.24

router bgp 65100
  router-id 10.19.0.24
  address-family l2vpn evpn
    maximum-paths ibgp 4
    advertise-pip
  template peer SPINE-RR
    remote-as 65100
    update-source loopback0
    password cisco123
    bfd multihop
    bfd multihop interval 999 min_rx 999 multiplier 3
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.19.0.1
    inherit peer SPINE-RR
  neighbor 10.19.0.2
    inherit peer SPINE-RR
  vrf PARTNER
    address-family ipv4 unicast
      advertise l2vpn evpn
      network 10.16.160.0/21
    neighbor 10.19.9.3
      remote-as 65130
      description DC1-PARTNER-VPNFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-PARTNER-FROM-FW in
        route-map RM-PARTNER-TO-FW out
  vrf TRANSIT
    address-family ipv4 unicast
      advertise l2vpn evpn
      maximum-paths 2
    neighbor 10.19.16.11
      remote-as 65140
      description DC1-TRANSIT-INETFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-TRANSIT-FROM-FW in
        route-map RM-TRANSIT-TO-FW out
    neighbor 10.19.16.19
      remote-as 65120
      description DC1-TRANSIT-SDWANFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-TRANSIT-FROM-SDWAN in
        route-map RM-TRANSIT-TO-SDWAN out
    neighbor 10.19.16.27
      remote-as 65170
      description DC1-TRANSIT-CLOUD1
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-TRANSIT-FROM-CLOUD in
        route-map RM-TRANSIT-TO-CLOUD out
    neighbor 10.19.16.35
      remote-as 65170
      description DC1-TRANSIT-CLOUD2
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-TRANSIT-FROM-CLOUD in
        route-map RM-TRANSIT-TO-CLOUD out

