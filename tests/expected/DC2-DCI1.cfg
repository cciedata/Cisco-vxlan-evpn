hostname DC2-DCI1
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature bgp
feature bfd
feature lacp
feature macsec
feature scp-server

key chain KC-DCI macsec
  key 01
    key-octet-string 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef cryptographic-algorithm AES_256_CMAC

macsec policy MP-DCI
  cipher-suite GCM-AES-XPN-256

route-map RM-LOOPBACK0 permit 10
  match interface loopback0

vrf context management
  ip route 0.0.0.0/0 10.250.16.1

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.16.32/24

interface loopback0
  description Router ID, BGP peering
  ip address 10.23.12.1/32

interface Ethernet1/1
  description DC2-BGW1 Ethernet1/3
  no switchport
  mtu 9216
  ip address 10.23.12.32/31
  no ip redirects
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3
  no shutdown

interface Ethernet1/23
  description DC2-DCI2 Ethernet1/23
  no switchport
  mtu 9216
  channel-group 23 mode active
  no shutdown

interface Ethernet1/24
  description DC2-DCI2 Ethernet1/24
  no switchport
  mtu 9216
  channel-group 23 mode active
  no shutdown

interface port-channel23
  description DC2-DCI2 port-channel23
  no switchport
  mtu 9216
  ip address 10.23.12.16/31
  no ip redirects
  no shutdown

interface Ethernet1/25
  description DC1-DCI1 Ethernet1/25
  no switchport
  mtu 9216
  ip address 10.0.255.1/31
  no ip redirects
  macsec keychain KC-DCI policy MP-DCI
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3
  no shutdown

router bgp 65260
  router-id 10.23.12.1
  address-family ipv4 unicast
    redistribute direct route-map RM-LOOPBACK0
  neighbor 10.23.12.33
    remote-as 65200
    description DC2-BGW1
    password cisco123
    bfd
    address-family ipv4 unicast
  neighbor 10.23.12.17
    remote-as 65260
    description DC2-DCI2
    password cisco123
    address-family ipv4 unicast
      next-hop-self
  neighbor 10.0.255.0
    remote-as 65160
    description DC1-DCI1
    password cisco123
    bfd
    address-family ipv4 unicast

