hostname DC1-DMZ2
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature lacp
feature vpc
feature scp-server

vrf context management
  ip route 0.0.0.0/0 10.250.0.1

vrf context VPC-KEEPALIVE

vlan 1400
  name DC1-DMZ-LB-VIP

vlan 1401
  name DC1-DMZ-LB-SELF

vlan 1402
  name DC1-DMZ-SRV-02

vlan 1403
  name DC1-DMZ-SRV-03

vlan 1404
  name DC1-DMZ-SRV-04

vlan 1405
  name DC1-DMZ-SRV-05

vlan 1406
  name DC1-DMZ-SRV-06

vlan 1407
  name DC1-DMZ-SRV-07

vlan 1408
  name DC1-DMZ-SRV-08

vlan 1409
  name DC1-DMZ-SRV-09

vlan 1410
  name DC1-DMZ-SRV-10

vlan 1411
  name DC1-DMZ-SRV-11

vlan 1412
  name DC1-DMZ-SRV-12

vlan 1413
  name DC1-DMZ-SRV-13

vlan 1414
  name DC1-DMZ-SRV-14

vlan 1415
  name DC1-DMZ-SRV-15

spanning-tree vlan 1400-1415 priority 8192

vpc domain 105
  peer-switch
  role priority 20
  peer-keepalive destination 10.19.17.8 source 10.19.17.9 vrf VPC-KEEPALIVE interval 1000 timeout 5 hold-timeout 3
  delay restore 360
  auto-recovery reload-delay 360
  peer-gateway

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.0.35/24

interface Ethernet1/48
  description DC1-DMZ1 Ethernet1/48
  no switchport
  mtu 9216
  vrf member VPC-KEEPALIVE
  ip address 10.19.17.9/31
  no shutdown

interface Ethernet1/53
  description DC1-DMZ1 Ethernet1/53
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/54
  description DC1-DMZ1 Ethernet1/54
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  channel-group 1000 mode active
  no shutdown

interface port-channel1000
  description DC1-DMZ1 port-channel1000
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/49
  description DC1-INETFW1 port16
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  mtu 9216
  channel-group 11 mode active
  no shutdown

interface Ethernet1/50
  description DC1-INETFW2 port16
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  mtu 9216
  channel-group 12 mode active
  no shutdown

interface port-channel11
  description DC1-INETFW1 agg-dmz
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 11

interface port-channel12
  description DC1-INETFW2 agg-dmz
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 1400-1415
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 12

