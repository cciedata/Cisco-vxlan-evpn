hostname DC2-BGW1
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature ospf
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature scp-server
nv overlay evpn

evpn multisite border-gateway 65200
  delay-restore time 300
  split-horizon per-site

evpn storm-control broadcast level 1
evpn storm-control multicast level 1
evpn storm-control unicast level 1

route-map RM-UNDERLAY-TO-DCI permit 10
  match interface loopback0 loopback1 loopback2

vrf context management
  ip route 0.0.0.0/0 10.250.16.1

vrf context PROD
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context DEV
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context REPLICATION
  vni 50041
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vlan 2501
  name L3VNI-PROD
  vn-segment 50001

vlan 2502
  name L3VNI-DEV
  vn-segment 50002

vlan 2541
  name L3VNI-REPLICATION
  vn-segment 50041

vlan 1010
  name PROD-1010
  vn-segment 11010

vlan 1011
  name PROD-1011
  vn-segment 11011

vlan 1012
  name PROD-1012
  vn-segment 11012

vlan 1013
  name PROD-1013
  vn-segment 11013

vlan 1014
  name PROD-1014
  vn-segment 11014

vlan 1015
  name PROD-1015
  vn-segment 11015

vlan 1016
  name PROD-1016
  vn-segment 11016

vlan 1017
  name PROD-1017
  vn-segment 11017

vlan 1110
  name DEV-1110
  vn-segment 11110

vlan 1111
  name DEV-1111
  vn-segment 11111

vlan 1112
  name DEV-1112
  vn-segment 11112

vlan 1113
  name DEV-1113
  vn-segment 11113

vlan 1114
  name DEV-1114
  vn-segment 11114

vlan 1115
  name DEV-1115
  vn-segment 11115

vlan 1116
  name DEV-1116
  vn-segment 11116

vlan 1117
  name DEV-1117
  vn-segment 11117

vlan 1118
  name DEV-1118
  vn-segment 11118

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.16.28/24

interface loopback0
  description Router ID, BGP peering
  ip address 10.23.0.27/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP source (NVE)
  ip address 10.23.1.25/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback2
  description Multi-Site VIP (anycast BGW pair)
  ip address 10.23.2.129/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan2501
  no shutdown
  mtu 9216
  vrf member PROD
  no ip redirects
  ip forward

interface Vlan2502
  no shutdown
  mtu 9216
  vrf member DEV
  no ip redirects
  ip forward

interface Vlan2541
  no shutdown
  mtu 9216
  vrf member REPLICATION
  no ip redirects
  ip forward

interface Ethernet1/1
  description DC2-S1
  no switchport
  mtu 9216
  ip address 10.23.4.89/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  evpn multisite fabric-tracking
  no shutdown

interface Ethernet1/2
  description DC2-S2
  no switchport
  mtu 9216
  ip address 10.23.4.181/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  evpn multisite fabric-tracking
  no shutdown

interface Ethernet1/3
  description DC2-DCI1 Ethernet1/1
  no switchport
  mtu 9216
  ip address 10.23.12.33/31
  no ip redirects
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3
  evpn multisite dci-tracking
  no shutdown

interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  multisite border-gateway interface loopback2
  global ingress-replication protocol bgp
  member vni 11010
    multisite ingress-replication
  member vni 11011
    multisite ingress-replication
  member vni 11012
    multisite ingress-replication
  member vni 11013
    multisite ingress-replication
  member vni 11014
    multisite ingress-replication
  member vni 11015
    multisite ingress-replication
  member vni 11016
    multisite ingress-replication
  member vni 11017
    multisite ingress-replication
  member vni 11110
    multisite ingress-replication
  member vni 11111
    multisite ingress-replication
  member vni 11112
    multisite ingress-replication
  member vni 11113
    multisite ingress-replication
  member vni 11114
    multisite ingress-replication
  member vni 11115
    multisite ingress-replication
  member vni 11116
    multisite ingress-replication
  member vni 11117
    multisite ingress-replication
  member vni 11118
    multisite ingress-replication
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf
  member vni 50041 associate-vrf

router ospf UNDERLAY
  router-id 10.23.0.27

router bgp 65200
  router-id 10.23.0.27
  address-family ipv4 unicast
    redistribute direct route-map RM-UNDERLAY-TO-DCI
  address-family l2vpn evpn
    maximum-paths ibgp 4
  template peer SPINE-RR
    remote-as 65200
    update-source loopback0
    password cisco123
    bfd multihop
    bfd multihop interval 999 min_rx 999 multiplier 3
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.23.0.1
    inherit peer SPINE-RR
  neighbor 10.23.0.2
    inherit peer SPINE-RR
  neighbor 10.23.12.32
    remote-as 65260
    description DC2-DCI1
    password cisco123
    bfd
    address-family ipv4 unicast
  neighbor 10.19.0.27
    remote-as 65100
    description DC1-BGW1
    update-source loopback0
    ebgp-multihop 64
    peer-type fabric-external
    password cisco123
    address-family l2vpn evpn
      send-community
      send-community extended
      rewrite-evpn-rt-asn
  neighbor 10.19.0.28
    remote-as 65100
    description DC1-BGW2
    update-source loopback0
    ebgp-multihop 64
    peer-type fabric-external
    password cisco123
    address-family l2vpn evpn
      send-community
      send-community extended
      rewrite-evpn-rt-asn
  vrf PROD
    address-family ipv4 unicast
      advertise l2vpn evpn
  vrf DEV
    address-family ipv4 unicast
      advertise l2vpn evpn
  vrf REPLICATION
    address-family ipv4 unicast
      advertise l2vpn evpn

