hostname DC1-ISP2
vrf management
 address-family ipv4 unicast
 !
!
interface MgmtEth0/RP0/CPU0/0
 description OOB management
 vrf management
 ipv4 address 10.250.0.37 255.255.255.0
!
interface Loopback0
 description Router ID, BGP peering
 ipv4 address 10.19.15.18 255.255.255.255
!
interface Bundle-Ether21
 description DC1-EDGE1/EDGE2 port-channel22
 mtu 9216
!
interface Bundle-Ether21.3200
 description Edge VLAN 3200
 ipv4 address 10.19.14.3 255.255.255.0
 encapsulation dot1q 3200
!
interface FourHundredGigE0/0/0/0
 description DC1-EDGE1 Ethernet1/6
 mtu 9216
 bundle id 21 mode active
!
interface FourHundredGigE0/0/0/2
 description DC1-EDGE2 Ethernet1/6
 mtu 9216
 bundle id 21 mode active
!
interface FourHundredGigE0/0/0/4
 description DC1-ISP1 FourHundredGigE0/0/0/4
 mtu 9216
 ipv4 address 10.19.15.1 255.255.255.254
!
interface FourHundredGigE0/0/0/6
 description ISP-B carrier handoff
 mtu 9216
 ipv4 address 192.0.2.6 255.255.255.252
!
prefix-set PS-OWN-PUBLIC
  198.51.100.0/24
end-set
!
prefix-set PS-DEFAULT
  0.0.0.0/0
end-set
!
route-policy RP-CARRIER-IN
  pass
end-policy
!
route-policy RP-CARRIER-OUT
  if destination in PS-OWN-PUBLIC and as-path in (ios-regex '^$') then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-INETFW-IN
  if destination in PS-OWN-PUBLIC then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-INETFW-OUT
  drop
end-policy
!
route-policy RP-COND-DEFAULT
  if rib-has-route in PS-DEFAULT then
    pass
  endif
end-policy
!
router static
 vrf management
  address-family ipv4 unicast
   0.0.0.0/0 10.250.0.1
  !
 !
 address-family ipv4 unicast
  198.51.100.0/24 Null0
  198.51.100.0/25 10.19.14.10
  198.51.100.160/27 10.19.14.10
  198.51.100.144/28 10.19.14.11
  198.51.100.128/28 10.19.14.12
 !
!
router bgp 65050
 bgp router-id 10.19.15.18
 bgp graceful-restart
 address-family ipv4 unicast
  network 198.51.100.0/24
 !
 neighbor 192.0.2.5
  remote-as 64497
  description ISP-B
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-CARRIER-IN in
   maximum-prefix 1200000 90 warning-only
   route-policy RP-CARRIER-OUT out
  !
 !
 neighbor 10.19.15.0
  remote-as 65050
  description DC1-ISP1
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   next-hop-self
  !
 !
 neighbor 10.19.14.10
  remote-as 65140
  description DC1-INETFW
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-INETFW-IN in
   default-originate policy RP-COND-DEFAULT
   route-policy RP-INETFW-OUT out
  !
 !
!
router vrrp
 interface Bundle-Ether21.3200
  address-family ipv4
   vrrp 1 version 3
    priority 100
    preempt delay 180
    address 10.19.14.1
    track interface FourHundredGigE0/0/0/6 20
   !
  !
 !
!
end
