        set ip 10.19.8.154 255.255.255.252
        set description "vlink PARTNER <-> TRANSIT"
    next
end
config router prefix-list
    edit "PL-DEFAULT"
        config rule
            edit 10
                set prefix 0.0.0.0 0.0.0.0
            next
        end
    next
    edit "PL-PROD-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.0.0 255.255.192.0
            next
        end
    next
    edit "PL-DEV-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.64.0 255.255.192.0
            next
        end
    next
    edit "PL-CITRIX-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.144.0 255.255.240.0
            next
        end
    next
    edit "PL-PARTNER-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.160.0 255.255.248.0
            next
        end
    next
    edit "PL-TRANSIT-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.144.0 255.255.240.0
            next
            edit 20
                set prefix 10.16.64.0 255.255.192.0
            next
            edit 30
                set prefix 10.16.160.0 255.255.248.0
            next
            edit 40
                set prefix 10.16.0.0 255.255.192.0
            next
        end
    next
end
config router route-map
    edit "RM-PROD-FROM-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-PROD-SUMMARY"
            next
        end
    next
    edit "RM-PROD-TO-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-DEFAULT"
                set set-aspath-action replace
                set set-aspath "65110"
            next
        end
    next
    edit "RM-LEAK-PROD-TO-TRANSIT"
