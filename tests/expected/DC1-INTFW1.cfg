        set ip 10.19.8.51 255.255.255.248
        set description "DC1-PARTNER-INTFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "LK-PROD"
        set vrf 10
        set interface "npu0_vlink0"
        set vlanid 10
        set ip 10.19.8.129 255.255.255.252
        set description "vlink PROD <-> TRANSIT"
    next
    edit "LK-T-PROD"
        set vrf 1
        set interface "npu0_vlink1"
        set vlanid 10
        set ip 10.19.8.130 255.255.255.252
        set description "vlink PROD <-> TRANSIT"
    next
    edit "LK-DEV"
        set vrf 11
        set interface "npu0_vlink0"
        set vlanid 11
        set ip 10.19.8.133 255.255.255.252
        set description "vlink DEV <-> TRANSIT"
    next
    edit "LK-T-DEV"
