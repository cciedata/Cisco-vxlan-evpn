config system global
    set hostname "DC1-INTFW1"
    set single-vdom-npuvlink enable
end
config system settings
    set allow-subnet-overlap enable
    set bfd enable
    set bfd-desired-min-tx 999
    set bfd-required-min-rx 999
    set bfd-detect-mult 3
end
config system ha
    set group-id 10
    set group-name "DC1-INTFW-HA"
    set mode a-p
    set hbdev "ha3" 50 "ha4" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "agg-inside"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt1"
            set gateway 10.250.0.1
        next
    end
end
config system interface
    edit "mgmt1"
        set ip 10.250.0.40 255.255.255.0
        set description "OOB management"
    next
    edit "port19"
        set description "DC1-SL1 Ethernet1/7"
        set mtu-override enable
        set mtu 9216
    next
    edit "port20"
        set description "DC1-SL2 Ethernet1/7"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-inside"
        set type aggregate
        set member "port19" "port20"
        set lacp-mode active
        set description "DC1-SL1/SL2 port-channel11"
        set mtu-override enable
        set mtu 9216
    next
    edit "TRANSIT-3000"
        set vrf 1
        set interface "agg-inside"
        set vlanid 3000
        set ip 10.19.16.3 255.255.255.248
        set description "DC1-TRANSIT-INTFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "PROD-3100"
        set vrf 10
        set interface "agg-inside"
        set vlanid 3100
        set ip 10.19.8.3 255.255.255.248
        set description "DC1-PROD-INTFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "DEV-3101"
        set vrf 11
        set interface "agg-inside"
        set vlanid 3101
        set ip 10.19.8.11 255.255.255.248
        set description "DC1-DEV-INTFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "CITRIX-3105"
        set vrf 15
        set interface "agg-inside"
        set vlanid 3105
        set ip 10.19.8.43 255.255.255.248
