            next
        end
    next
    edit "RM-TRANSIT-TO-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-TRANSIT-SUMMARY"
                set set-aspath-action replace
                set set-aspath "65110"
            next
        end
    next
end
