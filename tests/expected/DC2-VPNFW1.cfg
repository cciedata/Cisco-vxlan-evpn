config system global
    set hostname "DC2-VPNFW1"
end
config system settings
    set bfd enable
    set bfd-desired-min-tx 999
    set bfd-required-min-rx 999
    set bfd-detect-mult 3
end
config system ha
    set group-id 130
    set group-name "DC2-VPNFW-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "agg-inside" "agg-outside"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt1"
            set gateway 10.250.16.1
        next
    end
end
config system interface
    edit "mgmt1"
        set ip 10.250.16.46 255.255.255.0
        set allowaccess ping https ssh
        set description "OOB management"
    next
    edit "port37"
        set description "DC2-BL1 Ethernet1/11"
        set mtu-override enable
        set mtu 9216
    next
    edit "port38"
        set description "DC2-BL2 Ethernet1/11"
        set mtu-override enable
        set mtu 9216
    next
    edit "port39"
        set description "DC2-EDGE1 Ethernet1/11"
        set mtu-override enable
        set mtu 9216
    next
    edit "port40"
        set description "DC2-EDGE2 Ethernet1/11"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-inside"
        set type aggregate
        set member "port37" "port38"
        set lacp-mode active
        set description "DC2-BL1/BL2 port-channel15"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-outside"
        set type aggregate
        set member "port39" "port40"
        set lacp-mode active
        set description "DC2-EDGE1/EDGE2 port-channel15"
        set mtu-override enable
        set mtu 9216
    next
    edit "PARTNER-3300"
        set vrf 16
        set interface "agg-inside"
        set vlanid 3300
        set ip 10.23.9.3 255.255.255.248
        set description "DC2-PARTNER-VPNFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "OUTSIDE-3200"
        set vrf 0
        set interface "agg-outside"
        set vlanid 3200
        set ip 10.23.14.12 255.255.255.0
        set description "Edge VLAN 3200"
        set mtu-override enable
        set mtu 9216
    next
    edit "LO-WAN"
        set vrf 0
        set type loopback
        set ip 203.0.113.129 255.255.255.255
        set description "WAN endpoint (public 203.0.113.128/28)"
    next
end
config vpn ipsec phase1-interface
    edit "PARTNER01"
        set interface "LO-WAN"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set keylife 28800
        set remote-gw 198.18.100.1
        set add-route disable
        set dpd on-idle
        set dpd-retryinterval 10
        set psksecret cisco123
    next
end
config vpn ipsec phase2-interface
    edit "PARTNER01-1"
        set phase1name "PARTNER01"
        set proposal aes256gcm
        set dhgrp 20
        set keylifeseconds 3600
        set auto-negotiate enable
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 192.168.100.0 255.255.255.0
    next
end
config system interface
    edit "PARTNER01"
        set vrf 16
        set description "Sample partner (documentation values)"
    next
end
config firewall ippool
    edit "SNAT-PARTNER01"
        set type overload
        set startip 10.20.160.1
        set endip 10.20.160.14
        set comments "PARTNER01 source NAT, translated 10.20.160.0/28 (DC2)"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 10.23.14.1
        set device "OUTSIDE-3200"
        set vrf 0
    next
    edit 11
        set dst 192.168.100.0 255.255.255.0
        set device "PARTNER01"
        set vrf 16
        set comment "PARTNER01 protected network"
    next
    edit 12
        set dst 10.20.160.0 255.255.255.240
        set blackhole enable
        set vrf 16
        set comment "PARTNER01 translated /28 (BGP network)"
    next
end
config router prefix-list
    edit "PL-DEFAULT"
        config rule
            edit 10
                set prefix 0.0.0.0 0.0.0.0
            next
        end
    next
    edit "PL-PARTNER-NAT"
        config rule
            edit 10
                set prefix 10.20.160.0 255.255.255.240
            next
        end
    next
end
config router route-map
    edit "RM-PARTNER-FROM-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-DEFAULT"
            next
        end
    next
    edit "RM-PARTNER-TO-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-PARTNER-NAT"
            next
        end
    next
end
config router bgp
    set as 65230
    set router-id 10.23.9.3
    set graceful-restart enable
    config neighbor
        edit "10.23.9.1"
            set description "DC2-BL1"
            set remote-as 65200
            set interface "PARTNER-3300"
            set update-source "PARTNER-3300"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-PARTNER-FROM-LEAF"
            set route-map-out "RM-PARTNER-TO-LEAF"
        next
        edit "10.23.9.2"
            set description "DC2-BL2"
            set remote-as 65200
            set interface "PARTNER-3300"
            set update-source "PARTNER-3300"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-PARTNER-FROM-LEAF"
            set route-map-out "RM-PARTNER-TO-LEAF"
        next
    end
    config network
        edit 1
            set prefix 10.20.160.0 255.255.255.240
        next
    end
end
