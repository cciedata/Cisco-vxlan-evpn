hostname DC1-DCI2
username vamdadmin password 5 __VAMDADMIN_HASH__ role network-admin
no ip domain-lookup
feature bgp
feature bfd
feature lacp
feature macsec

key chain KC-DCI macsec
  key 01
    key-octet-string 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef cryptographic-algorithm AES_256_CMAC

macsec policy MP-DCI
  cipher-suite GCM-AES-XPN-256

route-map RM-LOOPBACK0 permit 10
  match interface loopback0

vrf context management
  ip route 0.0.0.0/0 10.250.0.1

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.0.33/24

interface loopback0
  description Router ID, BGP peering
  ip address 10.19.12.2/32

interface Ethernet1/1
  description DC1-BGW2 Ethernet1/3
  no switchport
  mtu 9216
  ip address 10.19.12.34/31
  no ip redirects
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3
  no shutdown

interface Ethernet1/23
  description DC1-DCI1 Ethernet1/23
  no switchport
  mtu 9216
  channel-group 23 mode active
  no shutdown

interface Ethernet1/24
  description DC1-DCI1 Ethernet1/24
  no switchport
  mtu 9216
  channel-group 23 mode active
  no shutdown

interface port-channel23
  description DC1-DCI1 port-channel23
  no switchport
  mtu 9216
  ip address 10.19.12.17/31
  no ip redirects
  no shutdown

interface Ethernet1/25
  description DC2-DCI2 Ethernet1/25
  no switchport
  mtu 9216
  ip address 10.0.255.2/31
  no ip redirects
  macsec keychain KC-DCI policy MP-DCI
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3
  no shutdown

router bgp 65160
  router-id 10.19.12.2
  address-family ipv4 unicast
    redistribute direct route-map RM-LOOPBACK0
  neighbor 10.19.12.35
    remote-as 65100
    description DC1-BGW2
    password cisco123
    bfd
    address-family ipv4 unicast
  neighbor 10.19.12.16
    remote-as 65160
    description DC1-DCI1
    password cisco123
    address-family ipv4 unicast
      next-hop-self
  neighbor 10.0.255.3
    remote-as 65260
    description DC2-DCI2
    password cisco123
    bfd
    address-family ipv4 unicast

