config system global
    set hostname "DC1-OOBFW2"
end
config system ha
    set group-id 50
    set group-name "DC1-OOBFW-HA"
    set mode a-p
    set hbdev "ha" 50 "port16" 50
    set session-pickup enable
    set override disable
    set priority 100
    set monitor "agg-oob"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt"
        next
    end
end
config system interface
    edit "mgmt"
        set ip 10.250.1.3 255.255.255.0
        set allowaccess ping https ssh
        set description "DC1-OOBNET2 Ethernet1/32"
    next
    edit "x1"
        set description "DC1-OOBAGG1 Ethernet1/22"
    next
    edit "x2"
        set description "DC1-OOBAGG2 Ethernet1/22"
    next
    edit "agg-oob"
        set type aggregate
        set member "x1" "x2"
        set lacp-mode active
        set description "DC1-OOBAGG1/OOBAGG2 port-channel22"
    next
    edit "BMC-102"
        set interface "agg-oob"
        set vlanid 102
        set ip 10.250.4.1 255.255.252.0
        set allowaccess ping
        set description "DC1-OOB-BMC"
    next
    edit "NETMGMT-100"
        set interface "agg-oob"
        set vlanid 100
        set ip 10.250.0.1 255.255.255.0
        set allowaccess ping
        set description "DC1-OOB-NETMGMT"
    next
    edit "OOBINFRA-101"
        set interface "agg-oob"
        set vlanid 101
        set ip 10.250.1.1 255.255.255.0
        set allowaccess ping
        set description "DC1-OOB-INFRA"
    next
    edit "port1"
        set ip 192.0.2.66 255.255.255.252
        set role wan
        set description "OOB-ISP carrier handoff"
    next
end
config user group
    edit "OOB-NET-TEAM"
    next
    edit "OOB-SRV-TEAM"
    next
end
config vpn ipsec phase1-interface
    edit "OOB-DC2"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set keylife 28800
        set remote-gw 192.0.2.70
        set add-route disable
        set dpd on-idle
        set dpd-retryinterval 10
        set psksecret cisco123
    next
    edit "RA-DIALUP"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set keylife 28800
        set eap enable
        set eap-identity send-request
        set assign-ip-from range
        set ipv4-start-ip 10.250.2.10
        set ipv4-end-ip 10.250.2.253
        set ipv4-netmask 255.255.255.0
        set ipv4-split-include "G-OOB-DC1-ALL"
        set dpd on-idle
        set dpd-retryinterval 10
        set psksecret cisco123
    next
end
config vpn ipsec phase2-interface
    edit "OOB-DC2"
        set phase1name "OOB-DC2"
        set proposal aes256gcm
        set dhgrp 20
        set keylifeseconds 3600
        set auto-negotiate enable
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
    edit "RA-DIALUP"
        set phase1name "RA-DIALUP"
        set proposal aes256gcm
        set dhgrp 20
        set keylifeseconds 3600
    next
end
config system interface
    edit "OOB-DC2"
        set description "OOB IPsec to DC2 (OOB circuits)"
    next
    edit "RA-DIALUP"
        set ip 10.250.2.1 255.255.255.255
        set remote-ip 10.250.2.254 255.255.255.0
        set description "Remote-access VPN (dial-up IKEv2, MFA)"
    next
end
config system zone
    edit "Z-BMC"
        set intrazone deny
        set interface "BMC-102"
    next
    edit "Z-NETMGMT"
        set intrazone deny
        set interface "NETMGMT-100"
    next
    edit "Z-OOBINFRA"
        set intrazone deny
        set interface "OOBINFRA-101"
    next
    edit "Z-RA"
        set intrazone deny
        set interface "RA-DIALUP"
    next
    edit "Z-OOB-DCI"
        set intrazone deny
        set interface "OOB-DC2"
    next
end
config firewall address
    edit "OOB-DC1-BMC"
        set subnet 10.250.4.0 255.255.252.0
    next
    edit "OOB-DC1-NETMGMT"
        set subnet 10.250.0.0 255.255.255.0
    next
    edit "OOB-DC1-OOBINFRA"
        set subnet 10.250.1.0 255.255.255.0
    next
    edit "OOB-DC1-RA"
        set subnet 10.250.2.0 255.255.255.0
    next
    edit "OOB-DC2-BMC"
        set subnet 10.250.20.0 255.255.252.0
    next
    edit "OOB-DC2-NETMGMT"
        set subnet 10.250.16.0 255.255.255.0
    next
    edit "OOB-DC2-OOBINFRA"
        set subnet 10.250.17.0 255.255.255.0
    next
    edit "OOB-DC2-RA"
        set subnet 10.250.18.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "G-OOB-DC1-ALL"
        set member "OOB-DC1-BMC" "OOB-DC1-NETMGMT" "OOB-DC1-OOBINFRA" "OOB-DC2-BMC" "OOB-DC2-NETMGMT" "OOB-DC2-OOBINFRA"
    next
end
config firewall policy
    edit 1
        set name "RA-NET-TO-BMC"
        set srcintf "Z-RA"
        set dstintf "Z-BMC"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC1-BMC"
        set schedule "always"
        set service "ALL"
        set groups "OOB-NET-TEAM"
        set logtraffic all
    next
    edit 2
        set name "RA-NET-TO-NETMGMT"
        set srcintf "Z-RA"
        set dstintf "Z-NETMGMT"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC1-NETMGMT"
        set schedule "always"
        set service "ALL"
        set groups "OOB-NET-TEAM"
        set logtraffic all
    next
    edit 3
        set name "RA-NET-TO-OOBINFRA"
        set srcintf "Z-RA"
        set dstintf "Z-OOBINFRA"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC1-OOBINFRA"
        set schedule "always"
        set service "ALL"
        set groups "OOB-NET-TEAM"
        set logtraffic all
    next
    edit 4
        set name "RA-SRV-TO-BMC"
        set srcintf "Z-RA"
        set dstintf "Z-BMC"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC1-BMC"
        set schedule "always"
        set service "ALL"
        set groups "OOB-SRV-TEAM"
        set logtraffic all
    next
    edit 5
        set name "RA-NET-TO-DC2"
        set srcintf "Z-RA"
        set dstintf "Z-OOB-DCI"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC2-BMC" "OOB-DC2-NETMGMT" "OOB-DC2-OOBINFRA"
        set schedule "always"
        set service "ALL"
        set groups "OOB-NET-TEAM"
        set logtraffic all
    next
    edit 6
        set name "RA-SRV-TO-DC2-BMC"
        set srcintf "Z-RA"
        set dstintf "Z-OOB-DCI"
        set action accept
        set srcaddr "OOB-DC1-RA"
        set dstaddr "OOB-DC2-BMC"
        set schedule "always"
        set service "ALL"
        set groups "OOB-SRV-TEAM"
        set logtraffic all
    next
    edit 7
        set name "BMC-TO-DC2"
        set srcintf "Z-BMC"
        set dstintf "Z-OOB-DCI"
        set action accept
        set srcaddr "OOB-DC1-BMC"
        set dstaddr "OOB-DC2-BMC"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 8
        set name "DC2-TO-BMC"
        set srcintf "Z-OOB-DCI"
        set dstintf "Z-BMC"
        set action accept
        set srcaddr "OOB-DC2-BMC" "OOB-DC2-RA"
        set dstaddr "OOB-DC1-BMC"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 9
        set name "NETMGMT-TO-DC2"
        set srcintf "Z-NETMGMT"
        set dstintf "Z-OOB-DCI"
        set action accept
        set srcaddr "OOB-DC1-NETMGMT"
        set dstaddr "OOB-DC2-NETMGMT"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 10
        set name "DC2-TO-NETMGMT"
        set srcintf "Z-OOB-DCI"
        set dstintf "Z-NETMGMT"
        set action accept
        set srcaddr "OOB-DC2-NETMGMT" "OOB-DC2-RA"
        set dstaddr "OOB-DC1-NETMGMT"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 11
        set name "OOBINFRA-TO-DC2"
        set srcintf "Z-OOBINFRA"
        set dstintf "Z-OOB-DCI"
        set action accept
        set srcaddr "OOB-DC1-OOBINFRA"
        set dstaddr "OOB-DC2-OOBINFRA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 12
        set name "DC2-TO-OOBINFRA"
        set srcintf "Z-OOB-DCI"
        set dstintf "Z-OOBINFRA"
        set action accept
        set srcaddr "OOB-DC2-OOBINFRA" "OOB-DC2-RA"
        set dstaddr "OOB-DC1-OOBINFRA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 192.0.2.65
        set device "port1"
        set comment "OOB carrier (192.0.2.64/30)"
    next
    edit 2
        set dst 10.250.20.0 255.255.252.0
        set device "OOB-DC2"
        set comment "DC2 OOB BMC"
    next
    edit 3
        set dst 10.250.16.0 255.255.255.0
        set device "OOB-DC2"
        set comment "DC2 OOB NETMGMT"
    next
    edit 4
        set dst 10.250.17.0 255.255.255.0
        set device "OOB-DC2"
        set comment "DC2 OOB OOBINFRA"
    next
    edit 5
        set dst 10.250.18.0 255.255.255.0
        set device "OOB-DC2"
        set comment "DC2 OOB remote-access pool"
    next
    edit 6
        set dst 10.250.20.0 255.255.252.0
        set blackhole enable
        set distance 254
        set comment "DC2 OOB BMC: never via the carrier"
    next
    edit 7
        set dst 10.250.16.0 255.255.255.0
        set blackhole enable
        set distance 254
        set comment "DC2 OOB NETMGMT: never via the carrier"
    next
    edit 8
        set dst 10.250.17.0 255.255.255.0
        set blackhole enable
        set distance 254
        set comment "DC2 OOB OOBINFRA: never via the carrier"
    next
    edit 9
        set dst 10.250.18.0 255.255.255.0
        set blackhole enable
        set distance 254
        set comment "DC2 OOB remote-access pool: never via the carrier"
    next
end
