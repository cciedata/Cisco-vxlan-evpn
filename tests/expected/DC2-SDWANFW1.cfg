config system global
    set hostname "DC2-SDWANFW1"
end
config system settings
    set bfd enable
    set bfd-desired-min-tx 999
    set bfd-required-min-rx 999
    set bfd-detect-mult 3
end
config system ha
    set group-id 120
    set group-name "DC2-SDWANFW-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "agg-inside" "agg-outside"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt1"
            set gateway 10.250.16.1
        next
    end
end
config system interface
    edit "mgmt1"
        set ip 10.250.16.44 255.255.255.0
        set description "OOB management"
    next
    edit "port37"
        set description "DC2-BL1 Ethernet1/9"
        set mtu-override enable
        set mtu 9216
    next
    edit "port38"
        set description "DC2-BL2 Ethernet1/9"
        set mtu-override enable
        set mtu 9216
    next
    edit "port39"
        set description "DC2-EDGE1 Ethernet1/9"
        set mtu-override enable
        set mtu 9216
    next
    edit "port40"
        set description "DC2-EDGE2 Ethernet1/9"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-inside"
        set type aggregate
        set member "port37" "port38"
        set lacp-mode active
        set description "DC2-BL1/BL2 port-channel13"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-outside"
        set type aggregate
        set member "port39" "port40"
        set lacp-mode active
        set description "DC2-EDGE1/EDGE2 port-channel13"
        set mtu-override enable
        set mtu 9216
    next
    edit "TRANSIT-3002"
        set vrf 1
        set interface "agg-inside"
        set vlanid 3002
        set ip 10.23.16.19 255.255.255.248
        set description "DC2-TRANSIT-SDWANFW"
        set mtu-override enable
        set mtu 9216
        set bfd enable
    next
    edit "OUTSIDE-3200"
        set vrf 0
        set interface "agg-outside"
        set vlanid 3200
        set ip 10.23.14.11 255.255.255.0
        set description "Edge VLAN 3200"
        set mtu-override enable
        set mtu 9216
    next
    edit "LO-WAN"
        set vrf 0
        set type loopback
        set ip 203.0.113.145 255.255.255.255
        set description "WAN endpoint (public 203.0.113.144/28)"
    next
end
config vpn ipsec phase1-interface
    edit "ADVPN-HUB"
        set type dynamic
        set interface "LO-WAN"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set ipv4-start-ip 10.79.8.2
        set ipv4-end-ip 10.79.15.253
        set ipv4-netmask 255.255.248.0
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set keylife 28800
        set add-route disable
        set dpd on-idle
        set dpd-retryinterval 10
        set auto-discovery-sender enable
        set auto-discovery-forwarder enable
        set psksecret cisco123
    next
end
config vpn ipsec phase2-interface
    edit "ADVPN-HUB"
        set phase1name "ADVPN-HUB"
        set proposal aes256gcm
        set dhgrp 20
        set keylifeseconds 3600
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
end
config system interface
    edit "ADVPN-HUB"
        set vrf 1
        set ip 10.79.8.1 255.255.255.255
        set remote-ip 10.79.15.254 255.255.248.0
        set description "ADVPN 2.0 hub, overlay 10.79.8.0/21"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 10.23.14.1
        set device "OUTSIDE-3200"
        set vrf 0
    next
end
config router prefix-list
    edit "PL-SDWAN-FROM-LEAF"
        config rule
            edit 10
                set prefix 10.20.144.0 255.255.240.0
            next
            edit 20
                set prefix 10.20.64.0 255.255.192.0
            next
            edit 30
                set prefix 10.20.0.0 255.255.192.0
            next
            edit 40
                set prefix 10.16.64.0 255.255.192.0
            next
            edit 50
                set prefix 10.16.0.0 255.255.192.0
            next
            edit 60
                set prefix 172.16.0.0 255.248.0.0
                set le 24
            next
            edit 70
                set prefix 172.30.0.0 255.254.0.0
                set le 24
            next
        end
    next
    edit "PL-SDWAN-ALLOW"
        config rule
            edit 10
                set prefix 10.20.144.0 255.255.240.0
            next
            edit 20
                set prefix 10.20.64.0 255.255.192.0
            next
            edit 30
                set prefix 10.20.0.0 255.255.192.0
            next
            edit 40
                set prefix 10.16.64.0 255.255.192.0
            next
            edit 50
                set prefix 10.16.0.0 255.255.192.0
            next
            edit 60
                set prefix 172.16.0.0 255.248.0.0
            next
            edit 70
                set prefix 172.30.0.0 255.254.0.0
            next
        end
    next
    edit "PL-BRANCH-LAN"
        config rule
            edit 10
                set prefix 10.64.0.0 255.240.0.0
                set le 24
            next
        end
    next
    edit "PL-BRANCH-SUMMARY"
        config rule
            edit 10
                set prefix 10.64.0.0 255.240.0.0
            next
        end
    next
end
config router route-map
    edit "RM-TRANSIT-FROM-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-SDWAN-FROM-LEAF"
            next
        end
    next
    edit "RM-TRANSIT-TO-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-BRANCH-SUMMARY"
            next
        end
    next
    edit "RM-FROM-BRANCH"
        config rule
            edit 10
                set match-ip-address "PL-BRANCH-LAN"
            next
        end
    next
    edit "RM-TO-BRANCH"
        config rule
            edit 10
                set match-ip-address "PL-SDWAN-ALLOW"
            next
            edit 20
                set match-ip-address "PL-BRANCH-LAN"
            next
        end
    next
end
config router bgp
    set as 65400
    set router-id 10.23.16.19
    set graceful-restart enable
    config neighbor
        edit "10.23.16.17"
            set description "DC2-BL1"
            set remote-as 65200
            set local-as 65220
            set local-as-no-prepend enable
            set local-as-replace-as enable
            set interface "TRANSIT-3002"
            set update-source "TRANSIT-3002"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-TRANSIT-FROM-LEAF"
            set route-map-out "RM-TRANSIT-TO-LEAF"
        next
        edit "10.23.16.18"
            set description "DC2-BL2"
            set remote-as 65200
            set local-as 65220
            set local-as-no-prepend enable
            set local-as-replace-as enable
            set interface "TRANSIT-3002"
            set update-source "TRANSIT-3002"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-TRANSIT-FROM-LEAF"
            set route-map-out "RM-TRANSIT-TO-LEAF"
        next
    end
    config neighbor-group
        edit "BRANCHES"
            set remote-as 65400
            set interface "ADVPN-HUB"
            set update-source "ADVPN-HUB"
            set next-hop-self enable
            set next-hop-self-rr disable
            set route-reflector-client enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-FROM-BRANCH"
            set route-map-out "RM-TO-BRANCH"
        next
    end
    config neighbor-range
        edit 1
            set prefix 10.79.8.0 255.255.248.0
            set neighbor-group "BRANCHES"
        next
    end
    config aggregate-address
        edit 1
            set prefix 10.64.0.0 255.240.0.0
        next
        edit 2
            set prefix 172.16.0.0 255.248.0.0
            set summary-only enable
        next
        edit 3
            set prefix 172.30.0.0 255.254.0.0
            set summary-only enable
        next
    end
end
