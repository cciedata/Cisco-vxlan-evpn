hostname DC2-EDGE2
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature lacp
feature vpc
feature scp-server

vrf context management
  ip route 0.0.0.0/0 10.250.16.1

vrf context VPC-KEEPALIVE

vlan 3200
  name DC2-EDGE-OUTSIDE

spanning-tree vlan 3200 priority 8192

vpc domain 204
  peer-switch
  role priority 20
  peer-keepalive destination 10.23.17.6 source 10.23.17.7 vrf VPC-KEEPALIVE interval 1000 timeout 5 hold-timeout 3
  delay restore 360
  auto-recovery reload-delay 360
  peer-gateway

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.16.31/24

interface Ethernet1/34
  description DC2-EDGE1 Ethernet1/34
  no switchport
  mtu 9216
  vrf member VPC-KEEPALIVE
  ip address 10.23.17.7/31
  no shutdown

