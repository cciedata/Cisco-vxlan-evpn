hostname DC2-CLOUD2
vrf management
 address-family ipv4 unicast
 !
!
bfd
 echo disable
!
interface MgmtEth0/RP0/CPU0/0
 description OOB management
 vrf management
 ipv4 address 10.250.16.43 255.255.255.0
!
interface Loopback0
 description Router ID, BGP peering
 ipv4 address 10.23.13.2 255.255.255.255
!
interface Bundle-Ether31
 description DC2-BL1/BL2 port-channel32
 mtu 9216
!
interface Bundle-Ether31.3004
 description DC2-TRANSIT-CLOUD2
 mtu 9216
 ipv4 address 10.23.16.35 255.255.255.248
 encapsulation dot1q 3004
!
interface FourHundredGigE0/0/0/0
 description DC2-BL1 Ethernet1/14
 mtu 9216
 bundle id 31 mode active
!
interface FourHundredGigE0/0/0/2
 description DC2-BL2 Ethernet1/14
 mtu 9216
 bundle id 31 mode active
!
interface FourHundredGigE0/0/0/4
 description DC2-CLOUD1 FourHundredGigE0/0/0/4
 mtu 9216
 ipv4 address 10.23.13.17 255.255.255.254
!
interface HundredGigE0/0/0/16
 description Cloud exchange port 2 (AWS VIF 2, ExpressRoute secondary)
 mtu 9216
!
interface HundredGigE0/0/0/16.111
 description AWS private VIF 2 to the Direct Connect Gateway, VLAN 111
 ipv4 mtu 1500
 ipv4 address 169.254.111.2 255.255.255.252
 encapsulation dot1q 111
!
interface HundredGigE0/0/0/16.210
 description Microsoft ExpressRoute secondary private peering, VLAN 210
 ipv4 mtu 1500
 ipv4 address 10.98.0.13 255.255.255.252
 encapsulation dot1q 210
!
prefix-set PS-GUARDRAIL
  10.19.0.0/16 le 32,
  10.23.0.0/16 le 32,
  10.0.0.0/16 le 32
end-set
!
prefix-set PS-AWS
  172.16.0.0/13 le 24
end-set
!
prefix-set PS-AZURE
  172.30.0.0/15 le 24
end-set
!
prefix-set PS-TO-CLOUD
  0.0.0.0/0,
  10.20.0.0/16,
  10.16.0.0/16,
  10.20.160.0/21
end-set
!
prefix-set PS-PREPEND
  0.0.0.0/0,
  10.16.0.0/16 le 32
end-set
!
prefix-set PS-FROM-FABRIC
  0.0.0.0/0,
  10.20.0.0/16 le 24
end-set
!
route-policy RP-AWS-IN
  if destination in PS-GUARDRAIL then
    drop
  elseif destination in PS-AWS then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-AZURE-IN
  if destination in PS-GUARDRAIL then
    drop
  elseif destination in PS-AZURE then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-CLOUD-OUT
  if destination in PS-TO-CLOUD then
    if destination in PS-PREPEND then
      prepend as-path 65270 3
    endif
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-FABRIC-IN
  if destination in PS-FROM-FABRIC then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-FABRIC-OUT
  if destination in PS-AWS or destination in PS-AZURE then
    pass
  else
    drop
  endif
end-policy
!
router static
 vrf management
  address-family ipv4 unicast
   0.0.0.0/0 10.250.16.1
  !
 !
!
router bgp 65270
 bgp router-id 10.23.13.2
 address-family ipv4 unicast
  aggregate-address 10.20.0.0/16
 !
 neighbor 169.254.111.1
  remote-as 65500
  description AWS private VIF 2 to the Direct Connect Gateway, VLAN 111
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 300
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-AWS-IN in
   maximum-prefix 100 90 warning-only
   route-policy RP-CLOUD-OUT out
  !
 !
 neighbor 10.98.0.14
  remote-as 12076
  description Microsoft ExpressRoute secondary private peering, VLAN 210
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 300
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-AZURE-IN in
   maximum-prefix 100 90 warning-only
   route-policy RP-CLOUD-OUT out
  !
 !
 neighbor 10.23.13.16
  remote-as 65270
  description DC2-CLOUD1
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   next-hop-self
  !
 !
 neighbor 10.23.16.33
  remote-as 65200
  description DC2-BL1 (DC2-TRANSIT-CLOUD2)
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-FABRIC-IN in
   route-policy RP-FABRIC-OUT out
  !
 !
 neighbor 10.23.16.34
  remote-as 65200
  description DC2-BL2 (DC2-TRANSIT-CLOUD2)
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-FABRIC-IN in
   route-policy RP-FABRIC-OUT out
  !
 !
!
end
