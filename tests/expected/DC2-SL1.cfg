hostname DC2-SL1
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature ospf
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature fabric forwarding
feature lacp
feature vpc
feature scp-server
nv overlay evpn

fabric forwarding anycast-gateway-mac 0200.0000.00aa
system nve infra-vlans 3900

ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-PROD-SUMMARY seq 10 permit 10.16.0.0/18
ip prefix-list PL-DEV-SUMMARY seq 10 permit 10.16.64.0/18
ip prefix-list PL-DC2-PROD-SUMMARY seq 10 permit 10.20.0.0/18
ip prefix-list PL-DC2-DEV-SUMMARY seq 10 permit 10.20.64.0/18
ip prefix-list PL-CITRIX-SUMMARY seq 10 permit 10.20.144.0/20
ip prefix-list PL-PARTNER-SUMMARY seq 10 permit 10.20.160.0/21
ip prefix-list PL-TRANSIT-SUMMARY seq 10 permit 10.20.144.0/20
ip prefix-list PL-TRANSIT-SUMMARY seq 20 permit 10.20.64.0/18
ip prefix-list PL-TRANSIT-SUMMARY seq 30 permit 10.20.0.0/18
ip prefix-list PL-TRANSIT-SUMMARY seq 40 permit 10.16.64.0/18
ip prefix-list PL-TRANSIT-SUMMARY seq 50 permit 10.20.160.0/21
ip prefix-list PL-TRANSIT-SUMMARY seq 60 permit 10.16.0.0/18

route-map RM-PROD-TO-FW permit 10
  match ip address prefix-list PL-PROD-SUMMARY
route-map RM-PROD-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-DEV-TO-FW permit 10
  match ip address prefix-list PL-DEV-SUMMARY
route-map RM-DEV-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-DC2-PROD-TO-FW permit 10
  match ip address prefix-list PL-DC2-PROD-SUMMARY
route-map RM-DC2-PROD-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-DC2-DEV-TO-FW permit 10
  match ip address prefix-list PL-DC2-DEV-SUMMARY
route-map RM-DC2-DEV-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-CITRIX-TO-FW permit 10
  match ip address prefix-list PL-CITRIX-SUMMARY
route-map RM-CITRIX-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-PARTNER-TO-FW permit 10
  match ip address prefix-list PL-PARTNER-SUMMARY
route-map RM-PARTNER-FROM-FW permit 10
  match ip address prefix-list PL-DEFAULT

route-map RM-TRANSIT-TO-FW permit 10
  match ip address prefix-list PL-DEFAULT
route-map RM-TRANSIT-FROM-FW permit 10
  match ip address prefix-list PL-TRANSIT-SUMMARY

vrf context management
  ip route 0.0.0.0/0 10.250.16.1

vrf context VPC-KEEPALIVE

vrf context PROD
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context DEV
  vni 50002
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context DC2-PROD
  vni 50011
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context DC2-DEV
  vni 50012
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context CITRIX
  vni 50022
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context PARTNER
  vni 50031
  ip route 10.20.160.0/21 Null0
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vrf context TRANSIT
  vni 50100
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

vlan 2501
  name L3VNI-PROD
  vn-segment 50001

vlan 2502
  name L3VNI-DEV
  vn-segment 50002

vlan 2511
  name L3VNI-DC2-PROD
  vn-segment 50011

vlan 2512
  name L3VNI-DC2-DEV
  vn-segment 50012

vlan 2522
  name L3VNI-CITRIX
  vn-segment 50022

vlan 2531
  name L3VNI-PARTNER
  vn-segment 50031

vlan 2599
  name L3VNI-TRANSIT
  vn-segment 50100

vlan 3000
  name DC2-TRANSIT-INTFW

vlan 3100
  name DC2-PROD-INTFW

vlan 3101
  name DC2-DEV-INTFW

vlan 3102
  name DC2-DC2-PROD-INTFW

vlan 3103
  name DC2-DC2-DEV-INTFW

vlan 3105
  name DC2-CITRIX-INTFW

vlan 3106
  name DC2-PARTNER-INTFW

vlan 3900
  name VPC-BACKUP-UNDERLAY

spanning-tree vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900 priority 8192

vpc domain 203
  peer-switch
  role priority 10
  peer-keepalive destination 10.23.17.5 source 10.23.17.4 vrf VPC-KEEPALIVE interval 1000 timeout 5 hold-timeout 3
  delay restore 360
  auto-recovery reload-delay 360
  peer-gateway
  layer3 peer-router
  ip arp synchronize

interface mgmt0
  description OOB management
  vrf member management
  ip address 10.250.16.26/24

interface loopback0
  description Router ID, BGP peering
  ip address 10.23.0.25/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP source (NVE)
  ip address 10.23.1.23/32
  ip address 10.23.2.3/32 secondary
  ip router ospf UNDERLAY area 0.0.0.0

interface Vlan2501
  no shutdown
  mtu 9216
  vrf member PROD
  no ip redirects
  ip forward

interface Vlan2502
  no shutdown
  mtu 9216
  vrf member DEV
  no ip redirects
  ip forward

interface Vlan2511
  no shutdown
  mtu 9216
  vrf member DC2-PROD
  no ip redirects
  ip forward

interface Vlan2512
  no shutdown
  mtu 9216
  vrf member DC2-DEV
  no ip redirects
  ip forward

interface Vlan2522
  no shutdown
  mtu 9216
  vrf member CITRIX
  no ip redirects
  ip forward

interface Vlan2531
  no shutdown
  mtu 9216
  vrf member PARTNER
  no ip redirects
  ip forward

interface Vlan2599
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip forward

interface Vlan3000
  description DC2-TRANSIT-INTFW
  no shutdown
  mtu 9216
  vrf member TRANSIT
  no ip redirects
  ip address 10.23.16.1/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3100
  description DC2-PROD-INTFW
  no shutdown
  mtu 9216
  vrf member PROD
  no ip redirects
  ip address 10.23.8.1/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3101
  description DC2-DEV-INTFW
  no shutdown
  mtu 9216
  vrf member DEV
  no ip redirects
  ip address 10.23.8.9/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3102
  description DC2-DC2-PROD-INTFW
  no shutdown
  mtu 9216
  vrf member DC2-PROD
  no ip redirects
  ip address 10.23.8.17/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3103
  description DC2-DC2-DEV-INTFW
  no shutdown
  mtu 9216
  vrf member DC2-DEV
  no ip redirects
  ip address 10.23.8.25/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3105
  description DC2-CITRIX-INTFW
  no shutdown
  mtu 9216
  vrf member CITRIX
  no ip redirects
  ip address 10.23.8.41/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3106
  description DC2-PARTNER-INTFW
  no shutdown
  mtu 9216
  vrf member PARTNER
  no ip redirects
  ip address 10.23.8.49/29
  no bfd echo
  bfd interval 999 min_rx 999 multiplier 3

interface Vlan3900
  description vPC backup underlay
  no shutdown
  mtu 9216
  no ip redirects
  ip address 10.23.3.10/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/34
  description DC2-SL2 Ethernet1/34
  no switchport
  mtu 9216
  vrf member VPC-KEEPALIVE
  ip address 10.23.17.4/31
  no shutdown

interface Ethernet1/1
  description DC2-S1
  no switchport
  mtu 9216
  ip address 10.23.4.85/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/2
  description DC2-S2
  no switchport
  mtu 9216
  ip address 10.23.4.177/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/3
  description DC2-SL2 Ethernet1/3
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/4
  description DC2-SL2 Ethernet1/4
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/5
  description DC2-SL2 Ethernet1/5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900
  channel-group 1000 mode active
  no shutdown

interface Ethernet1/6
  description DC2-SL2 Ethernet1/6
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900
  channel-group 1000 mode active
  no shutdown

interface port-channel1000
  description DC2-SL2 port-channel1000
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 2501-2502,2511-2512,2522,2531,2599,3000,3100-3103,3105-3106,3900
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/7
  description DC2-INTFW1 port19
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3000,3100-3103,3105-3106
  mtu 9216
  channel-group 11 mode active
  no shutdown

interface Ethernet1/8
  description DC2-INTFW2 port19
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3000,3100-3103,3105-3106
  mtu 9216
  channel-group 12 mode active
  no shutdown

interface port-channel11
  description DC2-INTFW1 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3000,3100-3103,3105-3106
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 11

interface port-channel12
  description DC2-INTFW2 agg-inside
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 3000,3100-3103,3105-3106
  spanning-tree port type edge trunk
  spanning-tree bpduguard enable
  mtu 9216
  vpc 12

interface nve1
  no shutdown
  host-reachability protocol bgp
  advertise virtual-rmac
  source-interface loopback1
  global suppress-arp
  global ingress-replication protocol bgp
  member vni 50001 associate-vrf
  member vni 50002 associate-vrf
  member vni 50011 associate-vrf
  member vni 50012 associate-vrf
  member vni 50022 associate-vrf
  member vni 50031 associate-vrf
  member vni 50100 associate-vrf

router ospf UNDERLAY
  router-id 10.23.0.25

router bgp 65200
  router-id 10.23.0.25
  address-family l2vpn evpn
    maximum-paths ibgp 4
    advertise-pip
  template peer SPINE-RR
    remote-as 65200
    update-source loopback0
    password cisco123
    bfd multihop
    bfd multihop interval 999 min_rx 999 multiplier 3
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.23.0.1
    inherit peer SPINE-RR
  neighbor 10.23.0.2
    inherit peer SPINE-RR
  vrf PROD
    address-family ipv4 unicast
      advertise l2vpn evpn
      aggregate-address 10.16.0.0/18
    neighbor 10.23.8.3
      remote-as 65210
      description DC2-PROD-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-PROD-FROM-FW in
        route-map RM-PROD-TO-FW out
  vrf DEV
    address-family ipv4 unicast
      advertise l2vpn evpn
      aggregate-address 10.16.64.0/18
    neighbor 10.23.8.11
      remote-as 65210
      description DC2-DEV-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-DEV-FROM-FW in
        route-map RM-DEV-TO-FW out
  vrf DC2-PROD
    address-family ipv4 unicast
      advertise l2vpn evpn
      aggregate-address 10.20.0.0/18
    neighbor 10.23.8.19
      remote-as 65210
      description DC2-DC2-PROD-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-DC2-PROD-FROM-FW in
        route-map RM-DC2-PROD-TO-FW out
  vrf DC2-DEV
    address-family ipv4 unicast
      advertise l2vpn evpn
      aggregate-address 10.20.64.0/18
    neighbor 10.23.8.27
      remote-as 65210
      description DC2-DC2-DEV-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-DC2-DEV-FROM-FW in
        route-map RM-DC2-DEV-TO-FW out
  vrf CITRIX
    address-family ipv4 unicast
      advertise l2vpn evpn
      aggregate-address 10.20.144.0/20
    neighbor 10.23.8.43
      remote-as 65210
      description DC2-CITRIX-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-CITRIX-FROM-FW in
        route-map RM-CITRIX-TO-FW out
  vrf PARTNER
    address-family ipv4 unicast
      advertise l2vpn evpn
      network 10.20.160.0/21
    neighbor 10.23.8.51
      remote-as 65210
      description DC2-PARTNER-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-PARTNER-FROM-FW in
        route-map RM-PARTNER-TO-FW out
  vrf TRANSIT
    address-family ipv4 unicast
      advertise l2vpn evpn
    neighbor 10.23.16.3
      remote-as 65210
      description DC2-TRANSIT-INTFW
      password cisco123
      bfd
      address-family ipv4 unicast
        route-map RM-TRANSIT-FROM-FW in
        route-map RM-TRANSIT-TO-FW out

