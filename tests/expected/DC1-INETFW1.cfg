        set mtu-override enable
        set mtu 9216
    next
    edit "agg-dmz"
        set type aggregate
        set member "port15" "port16"
        set lacp-mode active
        set description "DC1-DMZ1/DMZ2 port-channel11"
        set mtu-override enable
        set mtu 9216
    next
    edit "agg-inside"
