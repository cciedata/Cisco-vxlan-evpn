config system global
    set hostname "DC1-INETFW1"
end
config system settings
    set bfd enable
    set bfd-desired-min-tx 999
    set bfd-required-min-rx 999
    set bfd-detect-mult 3
end
config system ha
    set group-id 40
    set group-name "DC1-INETFW-HA"
    set mode a-p
    set hbdev "ha3" 50 "ha4" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "agg-inside" "agg-outside" "agg-dmz"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt1"
            set gateway 10.250.0.1
        next
    end
end
config system interface
    edit "mgmt1"
        set ip 10.250.0.38 255.255.255.0
        set allowaccess ping https ssh
        set description "OOB management"
    next
    edit "port15"
        set description "DC1-DMZ1 Ethernet1/49"
        set mtu-override enable
        set mtu 9216
    next
    edit "port16"
        set description "DC1-DMZ2 Ethernet1/49"
        set mtu-override enable
        set mtu 9216
    next
    edit "port19"
        set description "DC1-BL1 Ethernet1/7"
