config router static
    edit 1
        set dst 198.51.100.0 255.255.255.0
        set blackhole enable
        set vrf 1
    next
end
config router prefix-list
    edit "PL-DEFAULT"
        config rule
            edit 10
                set prefix 0.0.0.0 0.0.0.0
            next
        end
    next
    edit "PL-TRANSIT-SUMMARY"
        config rule
            edit 10
                set prefix 10.16.144.0 255.255.240.0
            next
            edit 20
                set prefix 10.16.64.0 255.255.192.0
            next
            edit 30
                set prefix 10.16.160.0 255.255.248.0
            next
            edit 40
                set prefix 10.16.0.0 255.255.192.0
            next
        end
    next
    edit "PL-PUBLIC"
        config rule
            edit 10
                set prefix 198.51.100.0 255.255.255.0
            next
        end
    next
end
config router route-map
    edit "RM-TRANSIT-FROM-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-TRANSIT-SUMMARY"
            next
        end
    next
    edit "RM-TRANSIT-TO-LEAF"
        config rule
            edit 10
                set match-ip-address "PL-DEFAULT"
            next
        end
    next
    edit "RM-FROM-ISP"
        config rule
            edit 10
                set match-ip-address "PL-DEFAULT"
            next
        end
    next
    edit "RM-TO-ISP"
        config rule
            edit 10
                set match-ip-address "PL-PUBLIC"
            next
        end
    next
end
config router bgp
    set as 65140
    set router-id 10.19.16.11
    set graceful-restart enable
    config neighbor
        edit "10.19.16.9"
            set description "DC1-BL1"
            set remote-as 65100
            set interface "TRANSIT-3001"
            set update-source "TRANSIT-3001"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-TRANSIT-FROM-LEAF"
            set route-map-out "RM-TRANSIT-TO-LEAF"
        next
        edit "10.19.16.10"
            set description "DC1-BL2"
            set remote-as 65100
            set interface "TRANSIT-3001"
            set update-source "TRANSIT-3001"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-TRANSIT-FROM-LEAF"
            set route-map-out "RM-TRANSIT-TO-LEAF"
        next
        edit "10.19.14.2"
            set description "DC1-ISP1"
            set remote-as 65050
            set interface "OUTSIDE-3200"
            set update-source "OUTSIDE-3200"
            set bfd enable
            set capability-graceful-restart enable
            set password cisco123
            set route-map-in "RM-FROM-ISP"
            set route-map-out "RM-TO-ISP"
        next
        edit "10.19.14.3"
