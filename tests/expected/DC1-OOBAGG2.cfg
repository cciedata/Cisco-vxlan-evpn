hostname DC1-OOBAGG2
username ciscoadmin password 5 __CISCOADMIN_HASH__ role network-admin
no ip domain-lookup
feature lacp
feature vpc
feature scp-server

vrf context management
  ip route 0.0.0.0/0 10.250.1.1

vrf context VPC-KEEPALIVE

vlan 100
  name DC1-OOB-NETMGMT

vlan 101
  name DC1-OOB-INFRA

vlan 102
  name DC1-OOB-BMC

spanning-tree vlan 100-102 priority 8192

vpc domain 199
  peer-switch
  role priority 20
  peer-keepalive destination 10.250.3.0 source 10.250.3.1 vrf VPC-KEEPALIVE interval 1000 timeout 5 hold-timeout 3
  delay restore 360
  auto-recovery reload-delay 360
  peer-gateway

