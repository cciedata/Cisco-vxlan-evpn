hostname DC1-OOBBMC3
no ip domain-lookup
feature lacp

vrf context management
  ip route 0.0.0.0/0 10.250.1.1

vlan 102
  name DC1-OOB-BMC

interface mgmt0
  description DC1-OOBNET1 Ethernet1/36
  vrf member management
  ip address 10.250.1.10/24

interface Ethernet1/49
  description DC1-OOBAGG1 Ethernet1/5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102
  channel-group 1 mode active
  no shutdown

interface Ethernet1/50
  description DC1-OOBAGG2 Ethernet1/5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102
  channel-group 1 mode active
  no shutdown

interface port-channel1
  description DC1-OOBAGG1/OOBAGG2 port-channel5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102

interface Ethernet1/1-48
  description Server BMC
  switchport
  switchport mode access
  switchport access vlan 102
  spanning-tree port type edge
  spanning-tree bpduguard enable
  no shutdown

