hostname DC2-OOBBMC12
no ip domain-lookup
feature lacp

vrf context management
  ip route 0.0.0.0/0 10.250.17.1

vlan 102
  name DC2-OOB-BMC

interface mgmt0
  description DC2-OOBNET2 Ethernet1/40
  vrf member management
  ip address 10.250.17.19/24

interface Ethernet1/49
  description DC2-OOBAGG1 Ethernet1/14
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102
  channel-group 1 mode active
  no shutdown

interface Ethernet1/50
  description DC2-OOBAGG2 Ethernet1/14
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102
  channel-group 1 mode active
  no shutdown

interface port-channel1
  description DC2-OOBAGG1/OOBAGG2 port-channel14
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 102

interface Ethernet1/1-48
  description Server BMC
  switchport
  switchport mode access
  switchport access vlan 102
  spanning-tree port type edge
  spanning-tree bpduguard enable
  no shutdown

