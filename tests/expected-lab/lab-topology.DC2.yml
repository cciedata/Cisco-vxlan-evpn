      kind: cisco_n9kv
      image: vrnetlab/cisco_n9kv:10.6.4.M-lite
      mgmt-ipv4: 10.250.16.24
      startup-config: configs/DC2-BL1.cfg
      env:
        QEMU_MEMORY: 8192
        QEMU_SMP: 3
        CLAB_MGMT_PASSTHROUGH: "true"
        SCRAPLI_TIMEOUT: 3600
