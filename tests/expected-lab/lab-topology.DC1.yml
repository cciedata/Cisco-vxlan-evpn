# DC1 Phase 3 lab topology for containerlab. Rendered by Infrahub (lab_topology), do not edit.
# Startup configs: configs/<node>.cfg (NX-OS startup-config artifacts);
# stand-in scripts: configs/<node>.sh (frr-lab-init artifacts, ISP routers included; carriers from the ISP routers' carrier-lab-init).
name: vamd-dc1-p3
mgmt:
  network: vamd-dc1-mgmt
  ipv4-subnet: 10.250.0.0/24
topology:
  nodes:
    DC1-BL1:
      kind: cisco_n9kv
      image: vrnetlab/cisco_n9kv:10.6.4.M-lite
      mgmt-ipv4: 10.250.0.24
      startup-config: configs/DC1-BL1.cfg
      env:
        QEMU_MEMORY: 8192
        QEMU_SMP: 3
        CLAB_MGMT_PASSTHROUGH: "true"
        SCRAPLI_TIMEOUT: 3600
    DC1-BL2:
      kind: cisco_n9kv
      image: vrnetlab/cisco_n9kv:10.6.4.M-lite
