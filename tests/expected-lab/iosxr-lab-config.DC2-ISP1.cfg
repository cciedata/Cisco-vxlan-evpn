hostname DC2-ISP1
vrf management
 address-family ipv4 unicast
 !
!
interface MgmtEth0/RP0/CPU0/0
 description OOB management
 vrf management
 ipv4 address 10.250.16.36 255.255.255.0
!
interface Loopback0
 description Router ID, BGP peering
 ipv4 address 10.23.15.17 255.255.255.255
!
interface Bundle-Ether21
 description DC2-EDGE1/EDGE2 port-channel21
 mtu 9216
!
interface Bundle-Ether21.3200
 description Edge VLAN 3200
 ipv4 address 10.23.14.2 255.255.255.0
 encapsulation dot1q 3200
!
interface GigabitEthernet0/0/0/0
 description DC2-EDGE1 Ethernet1/5
 mtu 9216
 bundle id 21 mode active
!
interface GigabitEthernet0/0/0/1
 description DC2-EDGE2 Ethernet1/5
 mtu 9216
 bundle id 21 mode active
!
interface GigabitEthernet0/0/0/2
 description DC2-ISP2 FourHundredGigE0/0/0/4
 mtu 9216
 ipv4 address 10.23.15.0 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 description ISP-A carrier handoff
 mtu 9216
 ipv4 address 192.0.2.10 255.255.255.252
!
prefix-set PS-OWN-PUBLIC
  203.0.113.0/24
end-set
!
prefix-set PS-DEFAULT
  0.0.0.0/0
end-set
!
route-policy RP-CARRIER-IN
  pass
end-policy
!
route-policy RP-CARRIER-OUT
  if destination in PS-OWN-PUBLIC and as-path in (ios-regex '^$') then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-INETFW-IN
  if destination in PS-OWN-PUBLIC then
    pass
  else
    drop
  endif
end-policy
!
route-policy RP-INETFW-OUT
  drop
end-policy
!
route-policy RP-COND-DEFAULT
  if rib-has-route in PS-DEFAULT then
    pass
  endif
end-policy
!
router static
 vrf management
  address-family ipv4 unicast
   0.0.0.0/0 10.250.16.1
  !
 !
 address-family ipv4 unicast
  203.0.113.0/24 Null0
  203.0.113.0/25 10.23.14.10
  203.0.113.160/27 10.23.14.10
  203.0.113.144/28 10.23.14.11
  203.0.113.128/28 10.23.14.12
 !
!
router bgp 65050
 bgp router-id 10.23.15.17
 bgp graceful-restart
 address-family ipv4 unicast
  network 203.0.113.0/24
 !
 neighbor 192.0.2.9
  remote-as 64496
  description ISP-A
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-CARRIER-IN in
   maximum-prefix 1200000 90 warning-only
   route-policy RP-CARRIER-OUT out
  !
 !
 neighbor 10.23.15.1
  remote-as 65050
  description DC2-ISP2
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   next-hop-self
  !
 !
 neighbor 10.23.14.10
  remote-as 65240
  description DC2-INETFW
  password clear cisco123
  bfd fast-detect
  bfd minimum-interval 999
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-INETFW-IN in
   default-originate policy RP-COND-DEFAULT
   route-policy RP-INETFW-OUT out
  !
 !
!
router vrrp
 interface Bundle-Ether21.3200
  address-family ipv4
   vrrp 1 version 3
    priority 110
    preempt delay 180
    address 10.23.14.1
    track interface GigabitEthernet0/0/0/3 20
   !
  !
 !
!
end
