---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: fabric-sites
      description: Sites the fabric generator builds (target group of generator fabric_site).
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    # Artifact targets; members are added by the fabric_site generator
    - name: fabric-spines
      description: Spines; target of the spine_startup_config artifact
    - name: fabric-server-leaves
      description: Server leaves; target of the leaf_startup_config artifact
    # Targets of the NX-OS, FortiOS and IOS XR artifacts; members added by the generator
    - name: fabric-border-leaves
      description: Border leaves; target of the border_leaf_startup_config artifact
    - name: fabric-service-leaves
      description: Service leaves; target of the service_leaf_startup_config artifact
    - name: fabric-edge-switches
      description: Edge switches; target of the edge_startup_config artifact
    - name: fabric-dmz-switches
      description: DMZ switches; target of the dmz_startup_config artifact
    - name: fabric-internet-fws
      description: Internet firewalls; target of the internet_fw_config artifact
    - name: fabric-internal-fws
      description: Internal firewalls; target of the internal_fw_config artifact
    - name: fabric-isp-routers
      description: ISP routers; target of the isp_router_startup_config artifact
    # Targets of the BGW and DCI switch artifacts; members added by the generator
    - name: fabric-bgws
      description: Border gateways; target of the bgw_startup_config artifact
    - name: fabric-dci-switches
      description: DCI switches; target of the dci_startup_config artifact
    # Target of the cloud router artifact; members added by the generator
    - name: fabric-cloud-routers
      description: Cloud routers; target of the cloud_router_iosxr_config artifact
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    # Target of the sdwan_fw_fortios_config artifact; members added by the generator
    - name: fabric-sdwan-fws
      description: SD-WAN hub firewalls; target of the sdwan_fw_fortios_config artifact
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    # Target of the vpn_fw_fortios_config artifact; members added by the generator
    - name: fabric-vpn-fws
      description: VPN-partner firewalls; target of the vpn_fw_fortios_config artifact
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    # Target of generator oob_site (DC1, DC2) and of the OOB artifacts; artifact members added by oob_site
    - name: oob-sites
      description: Sites the OOB generator builds (target group of generator oob_site).
    - name: oob-switches
      description: OOB aggregation and access switches; target of the oob_switch_startup_config artifact
    - name: oob-fws
      description: OOB firewalls; target of the oob_fw_fortios_config artifact
