---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ONE global FabricDesign object holds every design value that used to be a literal in generators, templates,
# transforms and lab code. Per-site values are dc1_/dc2_ fields.
# Every attribute is optional with no default_value: a missing value is caught by the code, never filled in here.
# Fields that hold decimals (*_m lengths) are kind Text and the code converts them with float(): kind Any did not keep
# 0.8 when tested.
version: "1.0"
nodes:
  - name: Design
    namespace: Fabric
    label: Fabric Design
    description: Global design values (one object, name global); per-site values as dc1_/dc2_ fields.
    icon: mdi:tune-variant
    include_in_menu: true
    human_friendly_id:
      - name__value
    display_label: "{{ name__value }}"
    attributes:
      - name: name
        description: Object name (global); the code reads the single FabricDesign object.
        kind: Text
        unique: true
        optional: false
      # ---- group A
      - name: internal_fw_ha_group_base
        description: "FW HA group id base for role internal_fw"
        kind: Number
        optional: true
      - name: internet_fw_ha_group_base
        description: "FW HA group id base for role internet_fw"
        kind: Number
        optional: true
      - name: oob_fw_ha_group_base
        description: "FW HA group id base for role oob_fw"
        kind: Number
        optional: true
      - name: sdwan_fw_ha_group_base
        description: "FW HA group id base for role sdwan_fw"
        kind: Number
        optional: true
      - name: vpn_fw_ha_group_base
        description: "FW HA group id base for role vpn_fw"
        kind: Number
        optional: true
      - name: asn_offset_cloud_router
        description: "Cloud router ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: asn_offset_dci
        description: "DCI switch ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: asn_offset_internal_fw
        description: "Internal FW ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: asn_offset_internet_fw
        description: "Internet FW ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: asn_offset_sdwan_fw
        description: "SD-WAN hub FW ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: asn_offset_vpn_fw
        description: "VPN-partner FW ASN = fabric ASN + offset"
        kind: Number
        optional: true
      - name: cloud_attachment_slots
        description: "Cloud router TRANSIT attachments: router -> leaf pair, slot"
        kind: JSON
        optional: true
      - name: cloud_bundle_id
        description: "Cloud router bundle number toward the border leaves"
        kind: Number
        optional: true
      - name: dc1_cloud_aws_vlan_1
        description: "AWS VIF VLAN (DC1, router 1)"
        kind: Number
        optional: true
      - name: dc1_cloud_aws_vlan_2
        description: "AWS VIF VLAN (DC1, router 2)"
        kind: Number
        optional: true
      - name: dc2_cloud_aws_vlan_1
        description: "AWS VIF VLAN (DC2, router 1)"
        kind: Number
        optional: true
      - name: dc2_cloud_aws_vlan_2
        description: "AWS VIF VLAN (DC2, router 2)"
        kind: Number
        optional: true
      - name: dc1_cloud_er_vlan
        description: "ExpressRoute VLAN (both legs) (DC1)"
        kind: Number
        optional: true
      - name: dc2_cloud_er_vlan
        description: "ExpressRoute VLAN (both legs) (DC2)"
        kind: Number
        optional: true
      - name: dc1_fw_ha_group_offset
        description: "FW HA group id site offset: group = <role>_ha_group_base + offset (DC1)"
        kind: Number
        optional: true
      - name: dc2_fw_ha_group_offset
        description: "FW HA group id site offset: group = <role>_ha_group_base + offset (DC2)"
        kind: Number
        optional: true
      - name: dc1_oob_vpc_domain
        description: "vPC domain id of the OOB aggregation pair (DC1)"
        kind: Number
        optional: true
      - name: dc2_oob_vpc_domain
        description: "vPC domain id of the OOB aggregation pair (DC2)"
        kind: Number
        optional: true
      - name: dc1_vpc_domain_base
        description: "vPC domain id base; domain = base + slot (DC1)"
        kind: Number
        optional: true
      - name: dc2_vpc_domain_base
        description: "vPC domain id base; domain = base + slot (DC2)"
        kind: Number
        optional: true
      - name: dci_pair_port_channel
        description: "DCI1<->DCI2 pair link port-channel number"
        kind: Number
        optional: true
      - name: dmz_vlan_count
        description: "Number of DMZ VLANs (1400..1415)"
        kind: Number
        optional: true
      - name: dmz_vlan_names
        description: "Named DMZ VLANs; others SRV-xx (format stays in code)"
        kind: JSON
        optional: true
      - name: edge_vlan
        description: "Edge (outside) VLAN id"
        kind: Number
        optional: true
      - name: fw_wan_vrf_id
        description: "FortiOS VRF id of the WAN side on SD-WAN/VPN FWs (no FabricVRF object)"
        kind: Number
        optional: true
      - name: isp_bundle_id
        description: "ISP router bundle number toward the edge pair (Bundle-Ether{n} format stays)"
        kind: Number
        optional: true
      - name: isp_router_asn
        description: "ASN shared by all four ISP routers"
        kind: Number
        optional: true
      - name: oob_access_uplink_port_channel
        description: "OOB access switch uplink port-channel number"
        kind: Number
        optional: true
      - name: oob_fw_port_channel_base
        description: "OOB agg Po/vPC toward OOB FW unit u = base + u"
        kind: Number
        optional: true
      - name: oob_static_route_id_base
        description: "First static route id on the OOB FW"
        kind: Number
        optional: true
      - name: oob_vlans
        description: "OOB VLAN ids, zones and carving inside the site OOB /20 (VLAN descriptions stay in code, DIS"
        kind: JSON
        optional: true
      - name: route_policy_seq_step
        description: "Sequence step for route-map / prefix-list / policy entries (all platforms)"
        kind: Number
        optional: true
      - name: sdwan_overlay_asn
        description: "SD-WAN overlay ASN (hub local-as, branches)"
        kind: Number
        optional: true
      - name: transit_attachment_slots
        description: "TRANSIT attachments: attached pair -> leaf pair, slot"
        kind: JSON
        optional: true
      - name: vlan_base_dmz
        description: "First DMZ VLAN id"
        kind: Number
        optional: true
      - name: vlan_base_tenant_attachment
        description: "Internal FW tenant attachment VLAN = base + slot"
        kind: Number
        optional: true
      - name: vlan_base_transit
        description: "TRANSIT attachment VLAN = base + slot"
        kind: Number
        optional: true
      - name: vlan_base_vpn
        description: "VPN-partner FW attachment VLAN = base + slot"
        kind: Number
        optional: true
      - name: vpc_backup_vlan
        description: "vPC backup underlay SVI VLAN (Vlan{id} format stays in code)"
        kind: Number
        optional: true
      - name: vpc_domain_slot_span
        description: "Max slot offset per site (guard base+1..base+99); 1..1000 platform limit stays in code"
        kind: Number
        optional: true
      - name: vpc_first_extra_server_slot
        description: "First vPC slot for further server-leaf pairs"
        kind: Number
        optional: true
      - name: vpc_first_server_slot
        description: "vPC slot of the first server-leaf pair"
        kind: Number
        optional: true
      - name: vpc_fixed_slots
        description: "vPC slot per fixed pair (pair prefix -> slot)"
        kind: JSON
        optional: true
      - name: vpc_peer_link_port_channel
        description: "Peer-link port-channel number on every vPC pair (fabric and OOB)"
        kind: Number
        optional: true
      - name: vpn_attachment_slots
        description: "VPN-partner FW attachment: pair -> leaf pair, VRF, slot"
        kind: JSON
        optional: true
      - name: vpn_static_route_id_base
        description: "First static route id for VPN partner routes"
        kind: Number
        optional: true
      # ---- group B
      - name: access_port_bpdu_guard
        description: "BPDU guard on host access ports"
        kind: Boolean
        optional: true
      - name: access_port_stp_edge
        description: "Host access ports are STP edge ports"
        kind: Boolean
        optional: true
      - name: anycast_gateway_mac
        description: "Distributed anycast gateway MAC"
        kind: Text
        optional: true
      - name: arp_suppression
        description: "EVPN ARP suppression"
        kind: Boolean
        optional: true
      - name: attachment_bgp_bfd
        description: "BFD on leaf <-> attached-device eBGP sessions"
        kind: Boolean
        optional: true
      - name: attachment_port_bpdu_guard
        description: "BPDU guard on attached-device trunks"
        kind: Boolean
        optional: true
      - name: attachment_port_l2_mode
        description: "L2 mode of switch ports toward attached devices"
        kind: Dropdown
        optional: true
        choices:
          - name: "trunk"
            label: "trunk"
      - name: attachment_port_stp_edge
        description: "Attached-device trunks are STP edge trunks"
        kind: Boolean
        optional: true
      - name: aws_bgp_password
        description: "Secret. Session: cloud router <-> AWS VIF eBGP"
        kind: Password
        optional: true
      - name: azure_bgp_password
        description: "Secret. Session: cloud router <-> Azure ExpressRoute eBGP"
        kind: Password
        optional: true
      - name: bfd_echo
        description: "BFD echo mode (off on NX-OS and cloud routers)"
        kind: Boolean
        optional: true
      - name: bfd_interval_ms
        description: "BFD tx/rx interval: fabric, FW-leaf, ISP, cloud router-BL, carrier sessions"
        kind: Number
        optional: true
      - name: bfd_multiplier
        description: "BFD multiplier for the same sessions as bfd_interval_ms"
        kind: Number
        optional: true
      - name: bgw_underlay_advertise_method
        description: "How BGW loopbacks enter the DCI underlay BGP"
        kind: Dropdown
        optional: true
        choices:
          - name: "redistribute direct"
            label: "redistribute direct"
      - name: carrier_names
        description: "Carrier peered by ISP router n"
        kind: JSON
        optional: true
      - name: cloud_accept_default_from_fabric
        description: "Cloud routers accept 0/0 from the BLs"
        kind: Boolean
        optional: true
      - name: cloud_advertise_default
        description: "Cloud routers advertise 0/0 to the clouds"
        kind: Boolean
        optional: true
      - name: cloud_backup_site
        description: "Site whose cloud routers prepend (backup)"
        kind: Text
        optional: true
      - name: cloud_bfd_interval_ms
        description: "BFD interval toward AWS / Azure"
        kind: Number
        optional: true
      - name: cloud_bfd_multiplier
        description: "BFD multiplier toward AWS / Azure"
        kind: Number
        optional: true
      - name: cloud_max_prefix
        description: "Max prefixes from each cloud"
        kind: Number
        optional: true
      - name: cloud_max_prefix_action
        description: "Cloud max-prefix action"
        kind: Dropdown
        optional: true
        choices:
          - name: "warning-only"
            label: "warning-only"
      - name: cloud_max_prefix_threshold_pct
        description: "Cloud max-prefix warning threshold"
        kind: Number
        optional: true
      - name: cloud_prepend_count
        description: "AS-path prepend count at the backup site"
        kind: Number
        optional: true
      - name: cloud_prepend_default
        description: "Backup site prepend also covers 0/0"
        kind: Boolean
        optional: true
      - name: cloud_router_bgp_graceful_restart
        description: "BGP graceful restart on cloud routers (off)"
        kind: Boolean
        optional: true
      - name: dc1_attachment_bgp_password
        description: "Secret. Session: leaf <-> attached device eBGP (internal/internet/SD-WAN/VPN FW, cloud routers) + cloud route"
        kind: Password
        optional: true
      - name: dc2_attachment_bgp_password
        description: "Secret. Session: leaf <-> attached device eBGP (internal/internet/SD-WAN/VPN FW, cloud routers) + cloud route"
        kind: Password
        optional: true
      - name: dc1_bgw_dci_bgp_password
        description: "Secret. Session: BGW <-> DCI underlay eBGP inside a site (DC1)"
        kind: Password
        optional: true
      - name: dc2_bgw_dci_bgp_password
        description: "Secret. Session: BGW <-> DCI underlay eBGP inside a site (DC2)"
        kind: Password
        optional: true
      - name: dc1_dci_pair_bgp_password
        description: "Secret. Session: DCI1 <-> DCI2 iBGP inside a site (DC1)"
        kind: Password
        optional: true
      - name: dc2_dci_pair_bgp_password
        description: "Secret. Session: DCI1 <-> DCI2 iBGP inside a site (DC2)"
        kind: Password
        optional: true
      - name: dc1_internet_edge_bgp_password
        description: "Secret. Session: Internet FW <-> own ISP routers (DC1)"
        kind: Password
        optional: true
      - name: dc2_internet_edge_bgp_password
        description: "Secret. Session: Internet FW <-> own ISP routers (DC2)"
        kind: Password
        optional: true
      - name: dc1_oob_remote_access_psk
        description: "Secret. Session: OOB FW remote-access dial-up IKEv2 (DC1)"
        kind: Password
        optional: true
      - name: dc2_oob_remote_access_psk
        description: "Secret. Session: OOB FW remote-access dial-up IKEv2 (DC2)"
        kind: Password
        optional: true
      - name: dc1_overlay_bgp_password
        description: "Secret. Session: overlay iBGP spine <-> VTEPs/BGWs inside a site (DC1)"
        kind: Password
        optional: true
      - name: dc2_overlay_bgp_password
        description: "Secret. Session: overlay iBGP spine <-> VTEPs/BGWs inside a site (DC2)"
        kind: Password
        optional: true
      - name: dci_circuit_bgp_password
        description: "Secret. Session: DCI circuit eBGP DC1 <-> DC2"
        kind: Password
        optional: true
      - name: dci_macsec_cipher_suite
        description: "DCI MACsec cipher suite"
        kind: Dropdown
        optional: true
        choices:
          - name: "GCM-AES-XPN-256"
            label: "GCM-AES-XPN-256"
      - name: dci_macsec_key
        description: "Secret. Session: DCI MACsec DC1 <-> DC2. Not the shared password: a 64-hex placeholder"
        kind: Password
        optional: true
      - name: dci_macsec_key_algorithm
        description: "DCI MACsec key cryptographic algorithm"
        kind: Dropdown
        optional: true
        choices:
          - name: "AES_256_CMAC"
            label: "AES_256_CMAC"
      - name: dci_macsec_key_id
        description: "DCI MACsec key id"
        kind: Text
        optional: true
      - name: dci_pair_next_hop_self
        description: "next-hop-self on the DCI1<->DCI2 iBGP session"
        kind: Boolean
        optional: true
      - name: distributed_anycast_gateway
        description: "Segment SVIs use the distributed anycast gateway"
        kind: Boolean
        optional: true
      - name: dns_lookup
        description: "DNS domain lookup on switches (off)"
        kind: Boolean
        optional: true
      - name: edge_vrrp_group_id
        description: "Edge VLAN VRRP group (VRID)"
        kind: Number
        optional: true
      - name: edge_vrrp_preempt_delay_s
        description: "Edge VRRP preempt delay"
        kind: Number
        optional: true
      - name: edge_vrrp_priority
        description: "Edge VRRP priority per ISP router"
        kind: JSON
        optional: true
      - name: edge_vrrp_track_decrement
        description: "Edge VRRP track decrement"
        kind: Number
        optional: true
      - name: edge_vrrp_version
        description: "Edge VRRP version"
        kind: Dropdown
        optional: true
        choices:
          - name: "3"
            label: "3"
      - name: esp_keylife_s
        description: "ESP SA lifetime"
        kind: Number
        optional: true
      - name: esp_proposal
        description: "ESP phase-2 proposal"
        kind: Text
        optional: true
      - name: evpn_bum_replication
        description: "BUM replication inside a site"
        kind: Dropdown
        optional: true
        choices:
          - name: "ingress-replication protocol bgp"
            label: "ingress-replication protocol bgp"
      - name: evpn_maximum_paths
        description: "BGP maximum-paths on VTEPs"
        kind: Number
        optional: true
      - name: evpn_rd_rt_mode
        description: "RD / route-target derivation"
        kind: Dropdown
        optional: true
        choices:
          - name: "auto"
            label: "auto"
      - name: fw_allow_subnet_overlap
        description: "Allow overlapping subnets across VRFs on the FW"
        kind: Boolean
        optional: true
      - name: fw_aspath_action
        description: "AS-path action toward leaves (only the FW AS in the path)"
        kind: Dropdown
        optional: true
        choices:
          - name: "replace"
            label: "replace"
      - name: fw_bgp_graceful_restart
        description: "BGP graceful restart on fabric FWs"
        kind: Boolean
        optional: true
      - name: fw_ha_priority
        description: "FW HA priority per unit"
        kind: JSON
        optional: true
      - name: fw_mgmt_allowed_access
        description: "Services allowed on the FW management interface"
        kind: List
        optional: true
      - name: fw_prepend_count
        description: "AS-path prepend count on the FW"
        kind: Number
        optional: true
      - name: fw_prepend_home_site
        description: "Site whose FW does NOT prepend (home of the prepended VRFs)"
        kind: Text
        optional: true
      - name: fw_zone_intrazone_allow
        description: "Allow traffic within a FW zone (deny)"
        kind: Boolean
        optional: true
      - name: ha_heartbeat_priority
        description: "Priority (weight) of each FW heartbeat port"
        kind: Number
        optional: true
      - name: ha_mode
        description: "FW HA mode (active-passive)"
        kind: Dropdown
        optional: true
        choices:
          - name: "a-p"
            label: "a-p"
      - name: ha_monitor_aggregates
        description: "FW HA monitors every peering aggregate of the unit (today: all of them on every FW role; the OOB WAN port is"
        kind: Boolean
        optional: true
      - name: ha_preempt
        description: "FW HA preemption (override)"
        kind: Boolean
        optional: true
      - name: ha_reserved_mgmt_interface
        description: "FW HA reserved management interface"
        kind: Boolean
        optional: true
      - name: ha_session_pickup
        description: "FW HA session pickup"
        kind: Boolean
        optional: true
      - name: ike_dh_group
        description: "IKE DH group (phase 1 and PFS)"
        kind: Number
        optional: true
      - name: ike_dpd_mode
        description: "Dead peer detection mode"
        kind: Dropdown
        optional: true
        choices:
          - name: "on-idle"
            label: "on-idle"
      - name: ike_dpd_retry_interval_s
        description: "DPD retry interval"
        kind: Number
        optional: true
      - name: ike_keylife_s
        description: "IKE SA lifetime"
        kind: Number
        optional: true
      - name: ike_peer_type
        description: "Accepted IKE peer id type"
        kind: Dropdown
        optional: true
        choices:
          - name: "any"
            label: "any"
      - name: ike_proposal
        description: "IKE phase-1 proposal"
        kind: Text
        optional: true
      - name: ike_version
        description: "IKE version for all FW tunnels"
        kind: Dropdown
        optional: true
        choices:
          - name: "2"
            label: "2"
      - name: inter_site_bgw_bgp_password
        description: "Secret. Session: Multi-Site BGW eBGP DC1 <-> DC2"
        kind: Password
        optional: true
      - name: inter_site_bum_replication
        description: "BUM replication between sites"
        kind: Dropdown
        optional: true
        choices:
          - name: "ingress-replication"
            label: "ingress-replication"
      - name: inter_site_delay_restore_s
        description: "Inter-site gateway delay restore"
        kind: Number
        optional: true
      - name: inter_site_ebgp_multihop_ttl
        description: "eBGP multihop TTL between inter-site gateways"
        kind: Number
        optional: true
      - name: inter_site_rt_asn_rewrite
        description: "Rewrite route-target ASN between sites (RT auto + different site ASNs)"
        kind: Boolean
        optional: true
      - name: inter_site_split_horizon
        description: "Inter-site split-horizon mode"
        kind: Dropdown
        optional: true
        choices:
          - name: "per-site"
            label: "per-site"
      - name: inter_site_storm_control_percent
        description: "Inter-site BUM storm control level (all three traffic types)"
        kind: Number
        optional: true
      - name: ipsec_add_route
        description: "Auto-add routes for dial-up peers"
        kind: Boolean
        optional: true
      - name: ipsec_auto_negotiate
        description: "Phase-2 auto-negotiate"
        kind: Boolean
        optional: true
      - name: ipsec_per_peer_interface
        description: "Create an interface per dial-up peer (net-device)"
        kind: Boolean
        optional: true
      - name: ipsec_phase2_selector
        description: "Phase-2 selectors of route-based tunnels (SD-WAN, OOB)"
        kind: IPNetwork
        optional: true
      - name: isp_bgp_graceful_restart
        description: "BGP graceful restart on ISP routers"
        kind: Boolean
        optional: true
      - name: isp_carrier_bgp_password
        description: "Secret. Session: ISP router <-> carrier eBGP"
        kind: Password
        optional: true
      - name: isp_max_prefix
        description: "Max prefixes from carriers"
        kind: Number
        optional: true
      - name: isp_max_prefix_action
        description: "Carrier max-prefix action"
        kind: Dropdown
        optional: true
        choices:
          - name: "warning-only"
            label: "warning-only"
      - name: isp_max_prefix_threshold_pct
        description: "Carrier max-prefix warning threshold"
        kind: Number
        optional: true
      - name: lacp_mode
        description: "LACP mode on every bundle (all platforms)"
        kind: Dropdown
        optional: true
        choices:
          - name: "active"
            label: "active"
      - name: local_admin_username
        description: "Local admin account (hash stays on __CISCOADMIN_HASH__ fill-at-delivery)"
        kind: Text
        optional: true
      - name: mgmt_vrf
        description: "IOS XR management VRF name (NX-OS management VRF is platform-fixed, stays)"
        kind: Text
        optional: true
      - name: mlag_arp_sync
        description: "ARP table sync between MLAG peers"
        kind: Boolean
        optional: true
      - name: mlag_layer3_peer_router
        description: "Routing adjacency over the MLAG peer-link"
        kind: Boolean
        optional: true
      - name: mlag_peer_gateway
        description: "MLAG peer routes for the partner MAC (peer-gateway)"
        kind: Boolean
        optional: true
      - name: mlag_peer_switch
        description: "MLAG pair acts as one STP root (peer-switch)"
        kind: Boolean
        optional: true
      - name: mlag_vtep_advertise_primary_ip
        description: "MLAG VTEP advertises its own primary IP (PIP)"
        kind: Boolean
        optional: true
      - name: mlag_vtep_virtual_router_mac
        description: "MLAG VTEP pair advertises a shared router MAC"
        kind: Boolean
        optional: true
      - name: mtu_cloud_exchange
        description: "MTU of the cloud-exchange physical port"
        kind: Number
        optional: true
      - name: mtu_cloud_handoff
        description: "IP MTU of AWS and ExpressRoute sub-interfaces"
        kind: Number
        optional: true
      - name: mtu_external
        description: "MTU of every FW, ISP router, carrier and DCI circuit link"
        kind: Number
        optional: true
      - name: mtu_fabric
        description: "MTU of fabric (spine-leaf, BGW-DCI) links"
        kind: Number
        optional: true
      - name: mtu_fw_subinterface
        description: "MTU of FW sub-interfaces (attachment VLANs)"
        kind: Number
        optional: true
      - name: mtu_svi
        description: "MTU of tenant / attachment SVIs on NX-OS VTEPs"
        kind: Number
        optional: true
      - name: mtu_vpc
        description: "MTU of vPC keepalive links and the backup SVI; the peer-link carries none"
        kind: Number
        optional: true
      - name: oob_blackhole_distance
        description: "Distance of OOB blackhole routes"
        kind: Number
        optional: true
      - name: oob_inter_site_ipsec_psk
        description: "Secret. Session: OOB IPsec DC1 <-> DC2 over the OOB carriers"
        kind: Password
        optional: true
      - name: oob_policy_log_traffic
        description: "Traffic logging on OOB policies"
        kind: Dropdown
